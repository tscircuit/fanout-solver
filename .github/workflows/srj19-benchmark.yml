name: SRJ19 Benchmark

on:
  workflow_dispatch:
    inputs:
      sample:
        description: "Optional sample id, for example sample001"
        required: false
        type: string
      max_layer_combinations:
        description: "Maximum layer assignments per sample"
        required: false
        default: "256"
        type: string
      concurrency:
        description: "Parallel sample processes"
        required: false
        default: "32"
        type: string
      sample_timeout_seconds:
        description: "Timeout for each sample"
        required: false
        default: "3600"
        type: string
  pull_request:
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  benchmark:
    name: Run six-layer dataset
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.title, '[BENCHMARK TEST]')
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 120
    env:
      BENCHMARK_SAMPLE: ${{ inputs.sample }}
      BENCHMARK_MAX_LAYER_COMBINATIONS: ${{ inputs.max_layer_combinations || '256' }}
      BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '32' }}
      BENCHMARK_SAMPLE_TIMEOUT_SECONDS: ${{ inputs.sample_timeout_seconds || '3600' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run benchmark
        run: |
          args=(
            --max-layer-combinations "$BENCHMARK_MAX_LAYER_COMBINATIONS"
            --concurrency "$BENCHMARK_CONCURRENCY"
            --sample-timeout-seconds "$BENCHMARK_SAMPLE_TIMEOUT_SECONDS"
          )
          if [[ -n "$BENCHMARK_SAMPLE" ]]; then
            args+=(--sample "$BENCHMARK_SAMPLE")
          fi
          ./benchmark.sh "${args[@]}"

      - name: Publish job summary
        if: always() && hashFiles('benchmark-results/srj19.md') != ''
        run: cat benchmark-results/srj19.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark report
        if: always() && hashFiles('benchmark-results/**') != ''
        uses: actions/upload-artifact@v4
        with:
          name: srj19-benchmark-${{ github.run_id }}
          path: benchmark-results
          if-no-files-found: error
