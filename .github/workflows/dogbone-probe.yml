name: Temporary dogbone verification
on: pull_request
permissions:
  contents: read
jobs:
  dogbone-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Capture focused SVG regression
        run: bun test -u ./tests/component-dogbone-layer.test.ts
      - name: Compare native dogbone stage on exact DDR input
        continue-on-error: true
        run: |
          git init /tmp/dogbone-consumer
          git -C /tmp/dogbone-consumer remote add origin https://github.com/tscircuit/bus-lanes-solver.git
          git -C /tmp/dogbone-consumer fetch --depth 1 origin d61928ea9b2ab6640b06932d10fdcf25b3dbcdc0
          git -C /tmp/dogbone-consumer checkout FETCH_HEAD
          cd /tmp/dogbone-consumer
          bun install
          cat > probe.ts <<'DOGBONE_PROBE'
          import { dirname, join } from "node:path"
          import { readFileSync, writeFileSync } from "node:fs"
          import { BusLanesPipelineSolver } from "./lib/index"
          
          const variant = process.argv[2]
          if (variant) {
            const input = await Bun.file("native-ddr-input.json").json()
            const started = Date.now()
            const solver = new BusLanesPipelineSolver(input)
            let passedStage = false
            while (!solver.solved && !solver.failed && Date.now() - started < 60_000) {
              solver.step()
              const phase = solver.phase
              if (!solver.failed && ((phase.startsWith("lanes_") && phase !== "lanes_failed") || phase === "route_shared_layers" || phase === "route_backward_packages")) {
                passedStage = true
                break
              }
            }
            console.log(JSON.stringify({
              variant,
              scope: "local dogbone stage only; no completed board routing",
              inputConnections: input.connections.length,
              obstacles: input.obstacles.length,
              passedStage,
              solved: solver.solved,
              failed: solver.failed,
              phase: solver.phase,
              attempt: solver.attempt,
              iterations: solver.iterations,
              dogbones: solver.stats?.dogbones,
              failureCode: solver.failureCode,
              error: String(solver.error ?? ""),
              seconds: (Date.now() - started) / 1000,
            }))
            process.exit(0)
          }
          
          const response = await fetch("https://raw.githubusercontent.com/tscircuit/am3352-sbc/feat/fresh-native-autorouting/routing/repros/fresh-ddr/whole-ddr.simple-route.json.gz")
          if (!response.ok) throw new Error("Native input download failed: " + response.status)
          const raw = Bun.gunzipSync(new Uint8Array(await response.arrayBuffer()))
          const inputHash = new Bun.CryptoHasher("sha256").update(raw).digest("hex")
          if (inputHash !== "3aaecdebece8150ea60c95e17995996e2d84f71d035df51603d5a8e136f15164") throw new Error("Native input hash mismatch")
          writeFileSync("native-ddr-input.json", raw)
          const matcherPath = join(dirname(Bun.resolveSync("@tscircuit/fanout-solver", process.cwd())), "match-component-dogbone-via-sites.ts")
          const original = readFileSync(matcherPath, "utf8")
          const candidate = readFileSync(join(process.env.GITHUB_WORKSPACE!, "lib/match-component-dogbone-via-sites.ts"), "utf8")
          const hash = (text: string) => new Bun.CryptoHasher("sha256").update(text).digest("hex")
          if (hash(original) !== "4d087054c545b05c7afb357f468e97349aba3a72497d61f01ef4749827a5bad8") throw new Error("Unexpected native dependency matcher")
          const needle = "      obstacle === sourceObstacle ||\n      distanceSegmentToObstacle(segment, obstacle)"
          if (original.split(needle).length !== 2 || candidate !== original.replace(needle, "      obstacle === sourceObstacle ||\n      !obstacle.layers.includes(segment.layer) ||\n      distanceSegmentToObstacle(segment, obstacle)")) throw new Error("Candidate includes changes beyond source-layer guard")
          console.log("DOGBONE_PROBE_INPUT=" + inputHash)
          try {
            for (const label of ["baseline", "candidate"]) {
              writeFileSync(matcherPath, label === "baseline" ? original : candidate)
              const child = Bun.spawn([process.execPath, import.meta.path, label], { stdout: "pipe", stderr: "pipe" })
              let timedOut = false
              const timer = setTimeout(() => { timedOut = true; child.kill("SIGKILL") }, 75_000)
              const [exitCode, stdout, stderr] = await Promise.all([child.exited, new Response(child.stdout).text(), new Response(child.stderr).text()])
              clearTimeout(timer)
              console.log("DOGBONE_PROBE_RESULT=" + JSON.stringify({label, exitCode, timedOut, stdout, stderr}))
            }
          } finally {
            writeFileSync(matcherPath, original)
          }
          DOGBONE_PROBE
          bun probe.ts
