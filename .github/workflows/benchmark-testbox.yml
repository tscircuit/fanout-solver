name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true
  pull_request:
    paths:
      - '.github/workflows/**'

jobs:
  benchmark:
    name: Run six-layer dataset
    runs-on: blacksmith-32vcpu-ubuntu-2404-arm
    timeout-minutes: 120
    env:
      BENCHMARK_SAMPLE: ${{ inputs.sample }}
      BENCHMARK_MAX_LAYER_COMBINATIONS: ${{ inputs.max_layer_combinations || '256' }}
      BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '32' }}
      BENCHMARK_SAMPLE_TIMEOUT_SECONDS: ${{ inputs.sample_timeout_seconds || '3600' }}

    steps:
      - name: Begin Testbox
        uses: useblacksmith/begin-testbox@v2
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Run Testbox
        uses: useblacksmith/run-testbox@v2
        if: always()
        env:
          BENCHMARK_SAMPLE: ${{ inputs.sample }}
          BENCHMARK_MAX_LAYER_COMBINATIONS: ${{ inputs.max_layer_combinations || '256' }}
          BENCHMARK_CONCURRENCY: ${{ inputs.concurrency || '32' }}
          BENCHMARK_SAMPLE_TIMEOUT_SECONDS: ${{ inputs.sample_timeout_seconds || '3600' }}