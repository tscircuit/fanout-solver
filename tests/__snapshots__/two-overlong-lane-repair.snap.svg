.5" cx="68.51851851851853" cy="356.2962962962963" r="15.555555555555554" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009642857142857144"/><circle data-type="circle" data-label="" data-x="-2" data-y="0.5" cx="68.51851851851853" cy="252.5925925925926" r="15.555555555555554" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009642857142857144"/><circle data-type="circle" data-label="" data-x="-2" data-y="2.4" cx="68.51851851851853" cy="55.5555555555556" r="15.555555555555554" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009642857142857144"/><circle data-type="circle" data-label="" data-x="-2" data-y="-2.7" cx="68.51851851851853" cy="584.4444444444445" r="15.555555555555554" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009642857142857144"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":103.7037037037037,"c":0,"e":275.9259259259259,"b":0,"d":-103.7037037037037,"f":304.44444444444446};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>