7.637795275590552" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Short source prefix preserved</text><text data-type="text" data-label="Original corner" data-x="5" data-y="1" x="489.7637795275591" y="366.2992125984252" fill="#777777" font-size="17.637795275590552" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Original corner</text><text data-type="text" data-label="Reserved through-via" data-x="1.2" data-y="2.4" x="154.6456692913386" y="242.83464566929135" fill="#222222" font-size="17.637795275590552" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Reserved through-via</text><text data-type="text" data-label="Unchanged vias and bridge" data-x="4.75" data-y="4.5" x="467.71653543307093" y="57.63779527559058" fill="#222222" font-size="17.637795275590552" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Unchanged vias and bridge</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":88.18897637795276,"c":0,"e":48.81889763779532,"b":0,"d":-88.18897637795276,"f":454.48818897637796};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
