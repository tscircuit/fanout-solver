inejoin="round" stroke-width="7"/></g><g><polyline data-points="-2.6628679656440357,-0.137132034355964 -2.6628679656440357,0.004289321881345509" data-type="line" data-label="" points="133.5992424049175,397.8492424049175 133.5992424049175,387.9497474683058" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-2.6628679656440357,0.004289321881345509 -1.2708365904123475,1.3963206971130335" data-type="line" data-label="" points="133.5992424049175,387.9497474683058 231.04143867113567,290.50755120208765" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-1.2708365904123475,1.3963206971130335 -1.2708365904123475,1.5377420533503432" data-type="line" data-label="" points="231.04143867113567,290.50755120208765 231.04143867113567,280.60805626547597" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-1.2708365904123475,1.5377420533503432 -1.412257946649657,1.6791634095876526" data-type="line" data-label="" points="231.04143867113567,280.60805626547597 221.141943734524,270.70856132886433" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-1.412257946649657,1.6791634095876526 -1.5536793028869667,1.6791634095876526" data-type="line" data-label="" points="221.141943734524,270.70856132886433 211.24244879791235,270.70856132886433" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-1.5536793028869667,1.6791634095876526 -2.9457106781186546,0.2871320343559647" data-type="line" data-label="" points="211.24244879791235,270.70856132886433 113.80025253169418,368.1507575950825" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-2.9457106781186546,0.2871320343559647 -3.087132034355964,0.28713203435596474" data-type="line" data-label="" points="113.80025253169418,368.1507575950825 103.90075759508252,368.1507575950825" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-3.087132034355964,0.28713203435596474 -3.6,0.8000000000000007" data-type="line" data-label="" points="103.90075759508252,368.1507575950825 68,332.24999999999994" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-3.6,0.8000000000000007 -3.6,1" data-type="line" data-label="" points="68,332.24999999999994 68,318.25" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7"/></g><g><polyline data-points="-3.6,1 -4,1" data-type="line" data-label="" points="68,318.25 40,318.25" fill="none" stroke="#16a34a" stroke-linejoin="round" stroke-width="7"/></g><g><rect data-type="rect" data-label="top" data-x="2.5" data-y="2.5" x="484.5" y="202.75" width="21" height="21" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.014285714285714285"/></g><g><rect data-type="rect" data-label="top" data-x="-2.5" data-y="-1" x="134.5" y="447.75" width="21" height="21" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.014285714285714285"/></g><g><rect data-type="rect" data-label="bottom" data-x="3.7" data-y="0" x="558" y="377.75" width="42" height="21" fill="rgba(0,0,255,0.5)" stroke="black" stroke-width="0.014285714285714285"/></g><circle data-type="circle" data-label="" data-x="2.85" data-y="2.85" cx="519.5" cy="188.75" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="-2.15" data-y="-0.65" cx="169.5" cy="433.75" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="-3.6" data-y="1" cx="68" cy="318.25" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":70,"c":0,"e":320,"b":0,"d":-70,"f":388.25};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>