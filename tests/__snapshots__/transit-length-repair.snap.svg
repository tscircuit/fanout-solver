<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-2,-0.5 -1.5,-0.5" data-type="line" data-label="" points="56.31067961165044,420.58252427184465 110.67961165048538,420.58252427184465" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="-1.5,-0.5 -0.4999999999999998,-0.4999999999999998" data-type="line" data-label="" points="110.67961165048538,420.58252427184465 219.4174757281553,420.58252427184465" fill="none" stroke="#9333ea" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="-0.4999999999999998,-0.4999999999999998 0.5000000000000002,-0.4999999999999998" data-type="line" data-label="" points="219.4174757281553,420.58252427184465 328.1553398058252,420.58252427184465" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="0.5000000000000002,-0.4999999999999998 3,-0.5" data-type="line" data-label="" points="328.1553398058252,420.58252427184465 600,420.58252427184465" fill="none" stroke="#9333ea" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="-2,2.5 -1.5,2.5" data-type="line" data-label="" points="56.31067961165044,94.36893203883494 110.67961165048538,94.36893203883494" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="-1.5,2.5 3,2.5" data-type="line" data-label="" points="110.67961165048538,94.36893203883494 600,94.36893203883494" fill="none" stroke="#9333ea" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="-2,1 -1.5,1" data-type="line" data-label="" points="56.31067961165044,257.4757281553398 110.67961165048538,257.4757281553398" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><rect data-type="rect" data-label="top" data-x="-2" data-y="-0.5" x="39.99999999999997" y="404.2718446601941" width="32.62135922330094" height="32.621359223301" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009196428571428572"/></g><g><rect data-type="rect" data-label="top" data-x="-2" data-y="2.5" x="39.99999999999997" y="78.05825242718446" width="32.62135922330094" height="32.62135922330097" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009196428571428572"/></g><g><rect data-type="rect" data-label="top" data-x="-2" data-y="1" x="39.99999999999997" y="241.16504854368935" width="32.62135922330094" height="32.62135922330094" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009196428571428572"/></g><g><rect data-type="rect" data-label="bottom" data-x="0" data-y="0" x="252.03883495145624" y="170.48543689320388" width="43.49514563106797" height="391.45631067961165" fill="rgba(0,0,255,0.5)" stroke="black" stroke-width="0.009196428571428572"/></g><circle data-type="circle" data-label="" data-x="-1.5" data-y="-0.5" cx="110.67961165048538" cy="420.58252427184465" r="16.310679611650485" fill="blue" stroke="none" stroke-width="0.009196428571428572"/><circle data-type="circle" data-label="" data-x="-0.4999999999999998" data-y="-0.4999999999999998" cx="219.4174757281553" cy="420.58252427184465" r="16.310679611650485" fill="blue" stroke="none" stroke-width="0.009196428571428572"/><circle data-type="circle" data-label="" data-x="0.5000000000000002" data-y="-0.4999999999999998" cx="328.1553398058252" cy="420.58252427184465" r="16.310679611650485" fill="blue" stroke="none" stroke-width="0.009196428571428572"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="2.5" cx="110.67961165048538" cy="94.36893203883494" r="16.310679611650485" fill="blue" stroke="none" stroke-width="0.009196428571428572"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="1" cx="110.67961165048538" cy="257.4757281553398" r="16.310679611650485" fill="blue" stroke="none" stroke-width="0.009196428571428572"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":108.7378640776699,"c":0,"e":273.78640776699024,"b":0,"d":-108.7378640776699,"f":366.2135922330097};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>