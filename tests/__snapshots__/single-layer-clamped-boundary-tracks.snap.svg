3.3093818181819" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="1.2218181818181824" stroke-dasharray="0.08 0.05"/></g><g><polyline data-points="17.9001,13.74203272727273 14.325,13.18708" data-type="line" data-label="" points="530.7687272727273,463.35666776859466 166.75854545454536,519.8609454545453" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="1.2218181818181824" stroke-dasharray="0.08 0.05"/></g><g><polyline data-points="17.9001,15.752272727272729 14.325,13.83732" data-type="line" data-label="" points="530.7687272727273,258.677685950413 166.75854545454536,453.65469090909073" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="1.2218181818181824" stroke-dasharray="0.08 0.05"/></g><g><polyline data-points="17.9001,16.25483272727273 14.325,13.99988" data-type="line" data-label="" points="530.7687272727273,207.50794049586716 166.75854545454536,437.1031272727273" fill="none" stroke="#94a3b8" stroke-linejoin="round" stroke-width="1.2218181818181824" stroke-dasharray="0.08 0.05"/></g><g><polyline data-points="14.145,14.16244 14.504999999999999,14.16244" data-type="line" data-label="" points="148.4312727272727,420.5515636363634 185.085818181818,420.5515636363634" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><g><polyline data-points="14.145,14.325 14.504999999999999,14.325" data-type="line" data-label="" points="148.4312727272727,404 185.085818181818,404" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><g><polyline data-points="14.145,13.67476 14.504999999999999,13.67476" data-type="line" data-label="" points="148.4312727272727,470.2062545454546 185.085818181818,470.2062545454546" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><g><polyline data-points="14.145,13.5122 14.504999999999999,13.5122" data-type="line" data-label="" points="148.4312727272727,486.75781818181804 185.085818181818,486.75781818181804" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><g><polyline data-points="14.145,13.349639999999999 14.504999999999999,13.349639999999999" data-type="line" data-label="" points="148.4312727272727,503.3093818181819 185.085818181818,503.3093818181819" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><g><polyline data-points="14.145,13.18708 14.504999999999999,13.18708" data-type="line" data-label="" points="148.4312727272727,519.8609454545453 185.085818181818,519.8609454545453" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><g><polyline data-points="14.145,13.83732 14.504999999999999,13.83732" data-type="line" data-label="" points="148.4312727272727,453.65469090909073 185.085818181818,453.65469090909073" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><g><polyline data-points="14.145,13.99988 14.504999999999999,13.99988" data-type="line" data-label="" points="148.4312727272727,437.1031272727273 185.085818181818,437.1031272727273" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.072727272727274"/></g><text data-type="text" data-label="Downstream RAM guidance" data-x="16" data-y="17.8" x="337.3040000000001" y="50.18181818181779" fill="#475569" font-size="20.363636363636374" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Downstream RAM guidance</text><text data-type="text" data-label="8 distinct inner6 boundary targets" data-x="15.8" data-y="12.5" x="316.9403636363638" y="589.8181818181818" fill="#2563eb" font-size="20.363636363636374" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">8 distinct inner6 boundary targets</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":101.81818181818186,"c":0,"e":-1291.7869090909096,"b":0,"d":-101.81818181818186,"f":1862.545454545455};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>