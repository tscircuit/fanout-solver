t data-type="text" data-label="iCE/Pi U22.B5: 1/1 escape; 0 vias" data-x="0" data-y="0.8" x="320" y="66.63299663299665" fill="#0f172a" font-size="28.282828282828284" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">iCE/Pi U22.B5: 1/1 escape; 0 vias</text><text data-type="text" data-label="0.5mm pitch | 0.1mm trace and clearance" data-x="0" data-y="0.55" x="320" y="125.55555555555557" fill="#475569" font-size="21.212121212121215" font-family="sans-serif" text-anchor="middle" dominant-baseline="text-after-edge">0.5mm pitch | 0.1mm trace and clearance</text><g><circle data-type="point" data-label="B5
