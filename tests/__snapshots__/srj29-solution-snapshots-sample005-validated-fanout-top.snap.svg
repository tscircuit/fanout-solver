"523.6363636363636" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><circle data-type="circle" data-label="" data-x="1.5" data-y="-1.2" cx="574.5454545454545" cy="523.6363636363636" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="0.4" cx="65.45454545454544" cy="252.12121212121212" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><circle data-type="circle" data-label="" data-x="1.5" data-y="0.4" cx="574.5454545454545" cy="252.12121212121212" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><circle data-type="circle" data-label="" data-x="-1.2" data-y="-0.10000000000000003" cx="116.36363636363635" cy="336.969696969697" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><circle data-type="circle" data-label="" data-x="1.2" data-y="-0.10000000000000003" cx="523.6363636363636" cy="336.969696969697" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="1.2" cx="65.45454545454544" cy="116.36363636363635" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><circle data-type="circle" data-label="" data-x="1.5" data-y="1.2" cx="574.5454545454545" cy="116.36363636363635" r="25.454545454545457" fill="blue" stroke="none" stroke-width="0.005892857142857142"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":169.69696969696972,"c":0,"e":320,"b":0,"d":-169.69696969696972,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>