bottom" data-x="1.5" data-y="1" x="436.8345323741007" y="208.10474820143884" width="24.17266187050359" height="24.17266187050359" fill="rgba(255,0,0,0.75)" stroke="black" stroke-width="0.00992857142857143"/></g><circle data-type="circle" data-label="" data-x="1.5" data-y="-1" cx="448.9208633093525" cy="421.6299280575539" r="12.086330935251796" fill="blue" stroke="none" stroke-width="0.00992857142857143"/><circle data-type="circle" data-label="" data-x="1.5" data-y="1" cx="448.9208633093525" cy="220.19107913669063" r="12.086330935251796" fill="blue" stroke="none" stroke-width="0.00992857142857143"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="-1" cx="46.043165467625926" cy="421.6299280575539" r="6.043165467625898" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00992857142857143"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="1" cx="46.043165467625926" cy="220.19107913669063" r="6.043165467625898" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.00992857142857143"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":100.71942446043164,"c":0,"e":297.841726618705,"b":0,"d":-100.71942446043164,"f":320.9105035971223};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>