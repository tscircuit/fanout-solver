<svg xmlns="http://www.w3.org/2000/svg" width="920" height="580"><rect width="920" height="580" fill="#10202c"/><g font-family="Arial" fill="#eff4f7"><text x="28" y="42" font-size="25">Blind escape: check only the layers occupied by copper</text><text x="28" y="80" font-family="monospace" font-size="18">&lt;board layers={4} allowBlindAndBuriedVias /&gt;</text><text x="28" y="110" font-size="17">Signal escapes: top → inner1. Supplied copper is unchanged.</text><text x="32" y="165" font-size="20">bottom pad</text><text x="340" y="165" font-size="20">2/2 pad escapes</text><text x="590" y="165" font-size="18">outside via span</text><text x="32" y="214" font-size="20">bottom trace</text><text x="340" y="214" font-size="20">2/2 pad escapes</text><text x="590" y="214" font-size="18">outside via span</text><text x="32" y="263" font-size="20">buried via</text><text x="340" y="263" font-size="20">2/2 pad escapes</text><text x="590" y="263" font-size="18">outside via span</text><text x="32" y="312" font-size="20">inner1 pad</text><text x="340" y="312" font-size="20">0/2 pad escapes</text><text x="590" y="312" font-size="18">must remain blocked</text><text x="32" y="361" font-size="20">inner1 trace</text><text x="340" y="361" font-size="20">0/2 pad escapes</text><text x="590" y="361" font-size="18">must remain blocked</text><text x="32" y="410" font-size="20">spanning via</text><text x="340" y="410" font-size="20">0/2 pad escapes</text><text x="590" y="410" font-size="18">must remain blocked</text><text x="32" y="459" font-size="20">through via</text><text x="340" y="459" font-size="20">0/2 pad escapes</text><text x="590" y="459" font-size="18">must remain blocked</text><text x="28" y="548" font-size="17">Bottom copper stays below a blind via. Through vias still intersect it.</text></g></svg>