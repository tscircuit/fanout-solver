0.32306" data-type="line" data-label="" points="565,355.924875 508.104,355.924875" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.112"/></g><g><polyline data-points="3.34976,-0.32306 2,-0.32306" data-type="line" data-label="" points="508.104,355.924875 390,355.924875" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.112"/></g><g><polyline data-points="4.4,0.32718 4,0.32718" data-type="line" data-label="" points="600,299.028875 565,299.028875" fill="none" stroke="#e11d48" stroke-linejoin="round" stroke-width="7.112"/></g><g><polyline data-points="4,0.32718 3.34976,0.32718" data-type="line" data-label="" points="565,299.028875 508.104,299.028875" fill="none" stroke="#e11d48" stroke-linejoin="round" stroke-width="7.112"/></g><g><polyline data-points="3.34976,0.32718 2,0.32718" data-type="line" data-label="" points="508.104,299.028875 390,299.028875" fill="none" stroke="#e11d48" stroke-linejoin="round" stroke-width="7.112"/></g><g><rect data-type="rect" data-label="" data-x="-1.35" data-y="-0.58498" x="39.999999999999986" y="366.592875" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><g><rect data-type="rect" data-label="" data-x="-1.35" data-y="-0.06114000000000003" x="39.999999999999986" y="320.75687500000004" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><g><rect data-type="rect" data-label="" data-x="-1.35" data-y="0.06526000000000004" x="39.999999999999986" y="309.696875" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><g><rect data-type="rect" data-label="" data-x="-1.35" data-y="0.5891" x="39.999999999999986" y="263.860875" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><g><rect data-type="rect" data-label="" data-x="2.65" data-y="-0.58498" x="390" y="366.592875" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><g><rect data-type="rect" data-label="" data-x="2.65" data-y="-0.06114000000000003" x="390" y="320.75687500000004" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><g><rect data-type="rect" data-label="" data-x="2.65" data-y="0.06526000000000004" x="390" y="309.696875" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><g><rect data-type="rect" data-label="" data-x="2.65" data-y="0.5891" x="390" y="263.860875" width="113.75" height="24.5" fill="#cbd5e1" stroke="black" stroke-width="0.011428571428571429"/></g><circle data-type="circle" data-label="" data-x="0" data-y="-0.32306" cx="215" cy="355.924875" r="10.5" fill="#334155" stroke="black" stroke-width="0.011428571428571429"/><circle data-type="circle" data-label="" data-x="0" data-y="0.32718" cx="215" cy="299.028875" r="10.5" fill="#334155" stroke="black" stroke-width="0.011428571428571429"/><circle data-type="circle" data-label="" data-x="4" data-y="-0.32306" cx="565" cy="355.924875" r="10.5" fill="#334155" stroke="black" stroke-width="0.011428571428571429"/><circle data-type="circle" data-label="" data-x="4" data-y="0.32718" cx="565" cy="299.028875" r="10.5" fill="#334155" stroke="black" stroke-width="0.011428571428571429"/><text data-type="text" data-label="Before: early boundary contact" data-x="-2" data-y="0.9" x="40" y="248.907125" fill="black" font-size="10.5" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: early boundary contact</text><text data-type="text" data-label="After: exact exit-phase corridors" data-x="2" data-y="0.9" x="390" y="248.907125" fill="black" font-size="10.5" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: exact exit-phase corridors</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":87.5,"c":0,"e":215,"b":0,"d":-87.5,"f":327.657125};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>