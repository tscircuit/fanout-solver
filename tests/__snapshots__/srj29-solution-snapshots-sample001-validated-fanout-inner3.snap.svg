le" data-label="" data-x="-1.4121320343559642" data-y="0.6121320343559643" cx="94.05887450304567" cy="254.0588745030457" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="1.5999999999999999" data-y="0.8" cx="576" cy="223.99999999999997" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="1.4121320343559642" data-y="0.6121320343559643" cx="545.9411254969543" cy="254.0588745030457" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-5.551115123125783e-17" data-y="-0.8" cx="320" cy="480" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="5.551115123125783e-17" data-y="-0.8" cx="320" cy="480" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-5.551115123125783e-17" data-y="0.8" cx="320" cy="223.99999999999997" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="5.551115123125783e-17" data-y="0.8" cx="320" cy="223.99999999999997" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-5.551115123125783e-17" data-y="-5.551115123125783e-17" cx="320" cy="352" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-0.18786796564403577" data-y="-0.18786796564403577" cx="289.94112549695427" cy="382.05887450304573" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="5.551115123125783e-17" data-y="-5.551115123125783e-17" cx="320" cy="352" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="0.18786796564403577" data-y="-0.18786796564403577" cx="350.05887450304573" cy="382.05887450304573" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-5.551115123125783e-17" data-y="1.5999999999999999" cx="320" cy="96" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-0.18786796564403577" data-y="1.4121320343559642" cx="289.94112549695427" cy="126.05887450304567" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="5.551115123125783e-17" data-y="1.5999999999999999" cx="320" cy="96" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="0.18786796564403577" data-y="1.4121320343559642" cx="350.05887450304573" cy="126.05887450304567" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":160.00000000000003,"c":0,"e":320,"b":0,"d":-160.00000000000003,"f":352};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>