le" data-label="" data-x="1.5999999999999999" data-y="-5.551115123125783e-17" cx="476.2790697674418" cy="320" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="-1.5999999999999999" data-y="5.551115123125783e-17" cx="59.534883720930196" cy="320" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="0.4" cx="72.55813953488368" cy="267.90697674418607" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="-0.8" data-y="-0.8" cx="163.7209302325581" cy="424.1860465116279" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="-0.18786796564403577" data-y="-0.6121320343559643" cx="243.440450985893" cy="399.7195207533349" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="0.8" data-y="-5.551115123125783e-17" cx="372.09302325581393" cy="320" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="0.18786796564403577" data-y="-0.6121320343559643" cx="292.373502502479" cy="399.7195207533349" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="0.8" data-y="-0.8" cx="372.09302325581393" cy="424.1860465116279" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="-5.551115123125783e-17" data-y="0.8" cx="267.906976744186" cy="215.81395348837208" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="0.8" data-y="0.8" cx="372.09302325581393" cy="215.81395348837208" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="1.5999999999999999" data-y="-0.8" cx="476.2790697674418" cy="424.1860465116279" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="1.4121320343559642" data-y="-0.9878679656440357" cx="451.81254400914884" cy="448.65257226992094" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="-0.8" data-y="0.8" cx="163.7209302325581" cy="215.81395348837208" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="-1.4121320343559642" data-y="0.9878679656440357" cx="84.00140947922321" cy="191.34742773007906" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="0.8" data-y="5.551115123125783e-17" cx="372.09302325581393" cy="320" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><circle data-type="circle" data-label="" data-x="2.4" data-y="0" cx="580.4651162790697" cy="320" r="19.53488372093023" fill="blue" stroke="none" stroke-width="0.007678571428571429"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":130.2325581395349,"c":0,"e":267.906976744186,"b":0,"d":-130.2325581395349,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>