-points="9.25,0 9.25,2.5" data-type="line" data-label="" points="474.48275862068965,372.1379310344828 474.48275862068965,275.58620689655174" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="9.25,2.5 8.75,3" data-type="line" data-label="" points="474.48275862068965,275.58620689655174 455.17241379310343,256.2758620689656" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="8.75,3 8.75,3.5" data-type="line" data-label="" points="455.17241379310343,256.2758620689656 455.17241379310343,236.96551724137936" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="8.75,3.5 8.25,4" data-type="line" data-label="" points="455.17241379310343,236.96551724137936 435.8620689655172,217.65517241379314" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="8.25,4 6.5,4" data-type="line" data-label="" points="435.8620689655172,217.65517241379314 368.2758620689655,217.65517241379314" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="6.5,4 6.02,4" data-type="line" data-label="" points="368.2758620689655,217.65517241379314 349.7379310344827,217.65517241379314" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="6.02,4 6,3.98" data-type="line" data-label="" points="349.7379310344827,217.65517241379314 348.9655172413793,218.4275862068966" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="6,3.98 6,-1.98" data-type="line" data-label="" points="348.9655172413793,218.4275862068966 348.9655172413793,448.60689655172416" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="6,-1.98 6.02,-2" data-type="line" data-label="" points="348.9655172413793,448.60689655172416 349.7379310344827,449.3793103448276" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="6.02,-2 12.280000000000001,-2" data-type="line" data-label="" points="349.7379310344827,449.3793103448276 591.5034482758622,449.3793103448276" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="12.280000000000001,-2 12.3,-1.98" data-type="line" data-label="" points="591.5034482758622,449.3793103448276 592.2758620689656,448.60689655172416" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="12.3,-1.98 12.3,-0.02" data-type="line" data-label="" points="592.2758620689656,448.60689655172416 592.2758620689656,372.91034482758624" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="12.3,-0.02 12.32,0" data-type="line" data-label="" points="592.2758620689656,372.91034482758624 593.048275862069,372.1379310344828" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><g><polyline data-points="12.32,0 12.5,0" data-type="line" data-label="" points="593.048275862069,372.1379310344828 600,372.1379310344828" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="3.089655172413793"/></g><text data-type="text" data-label="Original: clear hairpin" data-x="-2" data-y="4.7" x="40" y="190.62068965517244" fill="black" font-size="8.49655172413793" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Original: clear hairpin</text><text data-type="text" data-label="Rejected: shortcut crosses retained arm" data-x="6" data-y="4.7" x="348.9655172413793" y="190.62068965517244" fill="black" font-size="8.49655172413793" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Rejected: shortcut crosses retained arm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":38.62068965517241,"c":0,"e":117.24137931034483,"b":0,"d":-38.62068965517241,"f":372.1379310344828};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>