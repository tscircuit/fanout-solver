<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-0.4,2 -0.8,1.6 -0.8,1.6 -0.8,1.6" data-type="line" data-label="" points="287.6923076923077,147.6923076923077 244.6153846153846,190.76923076923077 244.6153846153846,190.76923076923077 244.6153846153846,190.76923076923077" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><g><polyline data-points="-0.4,-2 -0.8,-1.6 -0.8,-1.6 -0.8,-1.6" data-type="line" data-label="" points="287.6923076923077,578.4615384615385 244.6153846153846,535.3846153846155 244.6153846153846,535.3846153846155 244.6153846153846,535.3846153846155" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><g><polyline data-points="0.4,2 0,1.6 0,1.6 0,1.6" data-type="line" data-label="" points="373.84615384615387,147.6923076923077 330.7692307692308,190.76923076923077 330.7692307692308,190.76923076923077 330.7692307692308,190.76923076923077" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><g><polyline data-points="0.4,-2 0,-1.6 0,-1.6 0,-1.6" data-type="line" data-label="" points="373.84615384615387,578.4615384615385 330.7692307692308,535.3846153846155 330.7692307692308,535.3846153846155 330.7692307692308,535.3846153846155" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><g><polyline data-points="-0.4,2.8 -0.8,2.4 -0.8,2.4 -0.8,2.4" data-type="line" data-label="" points="287.6923076923077,61.53846153846155 244.6153846153846,104.61538461538464 244.6153846153846,104.61538461538464 244.6153846153846,104.61538461538464" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><g><polyline data-points="-0.4,-1.2 -0.8,-0.7999999999999999 -0.8,-0.7999999999999999 -0.8,-0.7999999999999999" data-type="line" data-label="" points="287.6923076923077,492.3076923076923 244.6153846153846,449.2307692307692 244.6153846153846,449.2307692307692 244.6153846153846,449.2307692307692" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><g><polyline data-points="0.4,2.8 0,2.4 0,2.4 0,2.4" data-type="line" data-label="" points="373.84615384615387,61.53846153846155 330.7692307692308,104.61538461538464 330.7692307692308,104.61538461538464 330.7692307692308,104.61538461538464" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><g><polyline data-points="0.4,-1.2 0,-0.7999999999999999 0,-0.7999999999999999 0,-0.7999999999999999" data-type="line" data-label="" points="373.84615384615387,492.3076923076923 330.7692307692308,449.2307692307692 330.7692307692308,449.2307692307692 330.7692307692308,449.2307692307692" fill="none" stroke="#e90" stroke-width="10.76923076923077"/></g><circle data-type="circle" data-label="" data-x="-0.4" data-y="2" cx="287.6923076923077" cy="147.6923076923077" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><circle data-type="circle" data-label="" data-x="0.4" data-y="2" cx="373.84615384615387" cy="147.6923076923077" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="2.8" cx="287.6923076923077" cy="61.53846153846155" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><circle data-type="circle" data-label="" data-x="0.4" data-y="2.8" cx="373.84615384615387" cy="61.53846153846155" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="-2" cx="287.6923076923077" cy="578.4615384615385" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><circle data-type="circle" data-label="" data-x="0.4" data-y="-2" cx="373.84615384615387" cy="578.4615384615385" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="-1.2" cx="287.6923076923077" cy="492.3076923076923" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><circle data-type="circle" data-label="" data-x="0.4" data-y="-1.2" cx="373.84615384615387" cy="492.3076923076923" r="21.53846153846154" fill="#c44" stroke="#c44" stroke-width="0.009285714285714286"/><g><circle data-type="point" data-label="signal_0" data-x="-0.8" data-y="1.6" cx="244.6153846153846" cy="190.76923076923077" r="3" fill="#45d"/></g><g><circle data-type="point" data-label="signal_0" data-x="-0.8" data-y="-1.6" cx="244.6153846153846" cy="535.3846153846155" r="3" fill="#45d"/></g><g><circle data-type="point" data-label="signal_1" data-x="0" data-y="1.6" cx="330.7692307692308" cy="190.76923076923077" r="3" fill="#45d"/></g><g><circle data-type="point" data-label="signal_1" data-x="0" data-y="-1.6" cx="330.7692307692308" cy="535.3846153846155" r="3" fill="#45d"/></g><g><circle data-type="point" data-label="signal_2" data-x="-0.8" data-y="2.4" cx="244.6153846153846" cy="104.61538461538464" r="3" fill="#45d"/></g><g><circle data-type="point" data-label="signal_2" data-x="-0.8" data-y="-0.7999999999999999" cx="244.6153846153846" cy="449.2307692307692" r="3" fill="#45d"/></g><g><circle data-type="point" data-label="signal_3" data-x="0" data-y="2.4" cx="330.7692307692308" cy="104.61538461538464" r="3" fill="#45d"/></g><g><circle data-type="point" data-label="signal_3" data-x="0" data-y="-0.7999999999999999" cx="330.7692307692308" cy="449.2307692307692" r="3" fill="#45d"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":107.6923076923077,"c":0,"e":330.7692307692308,"b":0,"d":-107.6923076923077,"f":363.0769230769231};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>