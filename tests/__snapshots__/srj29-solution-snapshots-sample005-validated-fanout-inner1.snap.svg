ue" stroke="none" stroke-width="0.025848214285714287"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="4.2" cx="55.474956822107174" cy="215.54404145077717" r="5.803108808290155" fill="blue" stroke="none" stroke-width="0.025848214285714287"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="0.4" cx="55.474956822107174" cy="362.5561312607945" r="5.803108808290155" fill="blue" stroke="none" stroke-width="0.025848214285714287"/><g><circle data-type="point" data-label="BUS_SIGNAL_LEFT_02_009
