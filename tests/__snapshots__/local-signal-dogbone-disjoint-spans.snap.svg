<svg xmlns="http://www.w3.org/2000/svg" width="920" height="460"><rect width="920" height="460" fill="#10202c"/><g font-family="Arial" fill="#eff4f7"><text x="28" y="42" font-size="25">Opposite-side blind vias: same position, separate layers</text><text x="28" y="78" font-size="20">2/2 local escapes routed; copper clearance passed</text><path d="M90 140H500" stroke="#72858d" stroke-width="2"/><text x="520" y="146" font-size="18">top</text><path d="M90 205H500" stroke="#72858d" stroke-width="2"/><text x="520" y="211" font-size="18">inner1</text><path d="M90 270H500" stroke="#72858d" stroke-width="2"/><text x="520" y="276" font-size="18">inner2</text><path d="M90 335H500" stroke="#72858d" stroke-width="2"/><text x="520" y="341" font-size="18">bottom</text><path d="M290 140V205" stroke="#ffcf75" stroke-width="18" stroke-linecap="round"/><path d="M290 335V270" stroke="#82cfe9" stroke-width="18" stroke-linecap="round"/><text x="640" y="160" font-size="18">Layer section</text><text x="640" y="193" font-size="17">Top → inner1</text><text x="640" y="225" font-size="17">Bottom → inner2</text><text x="28" y="395" font-family="monospace" font-size="17">&lt;board layers={4} allowBlindAndBuriedVias /&gt;</text><text x="28" y="430" font-size="17">Emitted via spans are drawn above. Overlapping spans must still clear each other.</text></g></svg>