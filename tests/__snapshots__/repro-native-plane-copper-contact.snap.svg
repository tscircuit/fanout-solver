,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="12.829999999999984" cx="852.8841607561636" cy="769.1489361702147" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="2.9899999999987585" data-y="12.829999999999984" cx="716.9503546095915" cy="769.1489361702147" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="13.329999999999984" cx="852.8841607561636" cy="633.2151300236428" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="13.329999999999984" cx="581.0165484630194" cy="633.2151300236428" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="1.9899999999987585" data-y="13.329999999999984" cx="445.08274231644725" cy="633.2151300236428" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="1.4899999999987583" data-y="13.329999999999984" cx="309.1489361698751" cy="633.2151300236428" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="13.829999999999984" cx="852.8841607561636" cy="497.28132387707046" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="13.829999999999984" cx="581.0165484630194" cy="497.28132387707046" r="32.6241134751773" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0036782608695652176