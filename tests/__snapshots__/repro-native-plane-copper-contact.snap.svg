ll="blue" stroke="none" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="0.23999999999875987" data-y="12.829999999999984" cx="90.67319461442773" cy="722.9620563034837" r="50.67319461442771" fill="blue" stroke="none" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="3.489999999998758" data-y="12.329999999999984" cx="822.6193390450496" cy="835.5691554466562" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="2.9899999999987585" data-y="12.329999999999984" cx="710.0122399018771" cy="835.5691554466562" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="12.329999999999984" cx="597.4051407587044" cy="835.5691554466562" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="1.9899999999987583" data-y="12.329999999999984" cx="484.79804161553176" cy="835.5691554466562" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="1.4899999999987583" data-y="12.329999999999984" cx="372.19094247235904" cy="835.5691554466562" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="12.829999999999984" cx="822.6193390450499" cy="722.9620563034837" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="2.9899999999987585" data-y="12.829999999999984" cx="710.0122399018771" cy="722.9620563034837" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="13.329999999999984" cx="822.6193390450499" cy="610.3549571603107" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="13.329999999999984" cx="597.4051407587044" cy="610.3549571603107" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="1.9899999999987585" data-y="13.329999999999984" cx="484.79804161553176" cy="610.3549571603107" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="1.4899999999987583" data-y="13.329999999999984" cx="372.19094247235904" cy="610.3549571603107" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="13.829999999999984" cx="822.6193390450499" cy="497.74785801713824" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="13.829999999999984" cx="597.4051407587044" cy="497.74785801713824" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="14.329999999999984" cx="822.6193390450499" cy="385.1407588739653" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="14.329999999999984" cx="597.4051407587044" cy="385.1407588739653" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="14.829999999999984" cx="822.6193390450499" cy="272.5336597307928" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="14.829999999999984" cx="597.4051407587044" cy="272.5336597307928" r="27.02570379436144" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004440217391305696"/><text data-type="text" data-label="iCE/Pi GND: 3/3 connected; 2 vias; fanout complete" data-x="0.5" data-y="15.4" x="149.2288861691568" y="144.16156670757255" fill="#0f172a" font-size="27.02570379436144" font-family="sans-serif" text-anchor="start" dominant-baseline="central">iCE/Pi GND: 3/3 connected; 2 vias; fanout complete</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="1000" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '1000');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":225.21419828634535,"c":0,"e":36.62178702598413,"b":0,"d":-225.21419828634535,"f":3612.460220317291};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>