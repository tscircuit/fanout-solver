ata-y="12.329999999999984" cx="801.3351877607788" cy="881.307371349098" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="12.329999999999984" cx="673.3796940194713" cy="881.307371349098" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="1.9899999999987583" data-y="12.329999999999984" cx="545.4242002781639" cy="881.307371349098" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="1.4899999999987583" data-y="12.329999999999984" cx="417.4687065368565" cy="881.307371349098" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="12.829999999999984" cx="929.2906815020862" cy="753.3518776077904" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="2.9899999999987585" data-y="12.829999999999984" cx="801.3351877607788" cy="753.3518776077904" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="13.329999999999984" cx="929.2906815020862" cy="625.3963838664831" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="13.329999999999984" cx="673.3796940194713" cy="625.3963838664831" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="1.9899999999987585" data-y="13.329999999999984" cx="545.4242002781639" cy="625.3963838664831" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="1.4899999999987583" data-y="13.329999999999984" cx="417.4687065368565" cy="625.3963838664831" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="13.829999999999984" cx="929.2906815020862" cy="497.44089012517543" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="13.829999999999984" cx="673.3796940194713" cy="497.44089012517543" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="14.329999999999984" cx="929.2906815020862" cy="369.4853963838682" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="14.329999999999984" cx="673.3796940194713" cy="369.4853963838682" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="3.4899999999987585" data-y="14.829999999999984" cx="929.2906815020862" cy="241.52990264256096" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><circle data-type="circle" data-label="" data-x="2.4899999999987585" data-y="14.829999999999984" cx="673.3796940194713" cy="241.52990264256096" r="30.709318497913777" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.003907608695652173"/><text data-type="text" data-label="iCE/Pi GND: 2/3 connected; fanout failed" data-x="0.5" data-y="15.4" x="164.11682892938558" y="95.66063977746626" fill="#0f172a" font-size="30.709318497913777" font-family="sans-serif" text-anchor="start" dominant-baseline="central">iCE/Pi GND: 2/3 connected; fanout failed</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="1000" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '1000');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":255.91098748261481,"c":0,"e":36.16133518807817,"b":0,"d":-255.91098748261481,"f":4036.6898470097344};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>