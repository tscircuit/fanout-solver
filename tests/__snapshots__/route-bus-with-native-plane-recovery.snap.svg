="" data-x="-0.325" data-y="-0.975" cx="290.1052631578947" cy="393.6842105263157" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="-0.325" cx="290.1052631578947" cy="284.2105263157895" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="0.325" cx="290.1052631578947" cy="174.73684210526315" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="0.975" cx="290.1052631578947" cy="65.26315789473685" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.325" data-y="-0.975" cx="399.57894736842104" cy="393.6842105263157" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.325" data-y="-0.325" cx="399.57894736842104" cy="284.2105263157895" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.325" data-y="0.325" cx="399.57894736842104" cy="174.73684210526315" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.325" data-y="0.975" cx="399.57894736842104" cy="65.26315789473685" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.975" data-y="-0.975" cx="509.0526315789473" cy="393.6842105263157" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.975" data-y="-0.325" cx="509.0526315789473" cy="284.2105263157895" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.975" data-y="0.325" cx="509.0526315789473" cy="174.73684210526315" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><circle data-type="circle" data-label="" data-x="0.975" data-y="0.975" cx="509.0526315789473" cy="65.26315789473685" r="25.26315789473684" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005937500000000001"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":168.42105263157893,"c":0,"e":344.84210526315786,"b":0,"d":-168.42105263157893,"f":229.4736842105263};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
