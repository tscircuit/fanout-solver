473684210526" y="533.6842105263156" width="14.73684210526315" height="14.736842105263236" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/></g><g><rect data-type="rect" data-label="top" data-x="0.39999999999999997" data-y="0.8" x="386.31578947368416" y="209.47368421052627" width="14.736842105263179" height="14.736842105263179" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/></g><g><rect data-type="rect" data-label="top" data-x="-1.4" data-y="0.39999999999999997" x="121.05263157894731" y="268.42105263157896" width="14.736842105263179" height="14.736842105263179" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/></g><g><rect data-type="rect" data-label="top" data-x="-1.4" data-y="-1" x="121.05263157894731" y="474.7368421052631" width="14.736842105263179" height="14.736842105263179" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/></g><circle data-type="circle" data-label="" data-x="-0.8" data-y="-0.6" cx="216.84210526315786" cy="423.1578947368421" r="14.73684210526316" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="-1.2" cx="275.78947368421046" cy="511.57894736842104" r="14.73684210526316" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0.6" data-y="1" cx="423.1578947368421" cy="187.36842105263153" r="14.73684210526316" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-1.2" data-y="0.6" cx="157.89473684210523" cy="246.31578947368416" r="14.73684210526316" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-1.2" data-y="-0.8" cx="157.89473684210523" cy="452.6315789473684" r="14.73684210526316" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":147.3684210526316,"c":0,"e":334.7368421052631,"b":0,"d":-147.3684210526316,"f":334.7368421052631};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
