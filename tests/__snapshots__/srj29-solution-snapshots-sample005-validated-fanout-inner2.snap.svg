ta-type="circle" data-label="" data-x="1.2" data-y="-0.4" cx="582.2847100175746" cy="394.7978910369069" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="1.5" data-y="-0.4" cx="594.0949033391914" cy="394.7978910369069" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="-1.2" data-y="1.2" cx="487.8031634446396" cy="331.8101933216169" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="1.2" cx="475.99297012302276" cy="331.8101933216169" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="1.2" data-y="1.2" cx="582.2847100175746" cy="331.8101933216169" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="1.5" data-y="1.2" cx="594.0949033391914" cy="331.8101933216169" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="-3.1999999999999997" data-y="0.7999999999999999" cx="409.06854130052716" cy="347.5571177504394" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="-3.1999999999999997" data-y="-1.1102230246251565e-16" cx="409.06854130052716" cy="379.05096660808437" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="4.2" cx="45.9050966608084" cy="213.70826010544815" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="0.4" cx="45.9050966608084" cy="363.30404217926184" r="5.905096660808436" fill="blue" stroke="none" stroke-width="0.025401785714285714"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":39.36731107205624,"c":0,"e":535.0439367311071,"b":0,"d":-39.36731107205624,"f":379.05096660808437};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>