4938917976" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="0.8" data-y="-1.1102230246251565e-16" cx="562.8621291448517" cy="370.8202443280978" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="1.2" data-y="-0.10000000000000003" cx="578.4991273996509" cy="374.7294938917976" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="-1.5999999999999999" data-y="1.5999999999999999" cx="469.04013961605585" cy="308.27225130890054" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="1.2" cx="472.94938917975566" cy="323.90924956369986" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="1.5999999999999999" data-y="1.5999999999999999" cx="594.1361256544502" cy="308.27225130890054" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="1.5" data-y="1.2" cx="590.2268760907505" cy="323.90924956369986" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="-3.1999999999999997" data-y="0.7999999999999999" cx="406.4921465968586" cy="339.5462478184992" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="-3.1999999999999997" data-y="-1.1102230246251565e-16" cx="406.4921465968586" cy="370.8202443280978" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="4.2" cx="45.86387434554973" cy="206.63176265270508" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="0.4" cx="45.86387434554973" cy="355.18324607329845" r="5.863874345549738" fill="blue" stroke="none" stroke-width="0.02558035714285714"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":39.09249563699826,"c":0,"e":531.588132635253,"b":0,"d":-39.09249563699826,"f":370.8202443280978};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>