435596426" data-y="0.21213203435596426" cx="351.88062447292725" cy="302.0009182970697" r="25.454545454545453" fill="blue" stroke="none" stroke-width="0.005892857142857143"/><circle data-type="circle" data-label="" data-x="-0.5" data-y="-0.8" cx="303.030303030303" cy="473.75665746050606" r="25.454545454545453" fill="blue" stroke="none" stroke-width="0.005892857142857143"/><circle data-type="circle" data-label="" data-x="-0.5" data-y="0.8" cx="303.030303030303" cy="202.24150594535456" r="25.454545454545453" fill="blue" stroke="none" stroke-width="0.005892857142857143"/><circle data-type="circle" data-label="" data-x="-0.5878679656440358" data-y="0.21213203435596426" cx="288.11937552707275" cy="302.0009182970697" r="25.454545454545453" fill="blue" stroke="none" stroke-width="0.005892857142857143"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":169.6969696969697,"c":0,"e":387.8787878787879,"b":0,"d":-169.6969696969697,"f":337.9990817029303};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>