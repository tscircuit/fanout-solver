bottom" data-x="-0.415" data-y="0.2" x="173.25000000000006" y="313.55555555555554" width="45.55555555555557" height="45.5555555555556" fill="rgba(255,0,0,0.9375)" stroke="black" stroke-width="0.004390243902439024"/></g><circle data-type="circle" data-label="" data-x="-0.415" data-y="0.2" cx="196.02777777777783" cy="336.3333333333333" r="22.777777777777782" fill="blue" stroke="none" stroke-width="0.004390243902439024"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="290.5555555555556" cy="381.88888888888886" r="22.777777777777782" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004390243902439024"/><circle data-type="circle" data-label="" data-x="0.6" data-y="0" cx="427.2222222222223" cy="381.88888888888886" r="22.777777777777782" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004390243902439024"/><circle data-type="circle" data-label="" data-x="0" data-y="-0.6" cx="290.5555555555556" cy="518.5555555555555" r="22.777777777777782" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004390243902439024"/><circle data-type="circle" data-label="" data-x="0.6" data-y="-0.6" cx="427.2222222222223" cy="518.5555555555555" r="22.777777777777782" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004390243902439024"/><text data-type="text" data-label="Plane escape through a copper opening · 1/1 routed" data-x="-1.1" data-y="1.32" x="40" y="81.22222222222217" fill="#0f172a" font-size="27.333333333333336" font-family="sans-serif" text-anchor="start" dominant-baseline="central">Plane escape through a copper opening · 1/1 routed</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="700" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="900" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '900');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '700');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":227.7777777777778,"c":0,"e":290.5555555555556,"b":0,"d":-227.7777777777778,"f":381.88888888888886};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>