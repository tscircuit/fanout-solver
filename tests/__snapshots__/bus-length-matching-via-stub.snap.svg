<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-1,0 0,0" data-type="line" data-label="" points="257.1203621334988,186.56330749353998 326.0264775512422,186.56330749353998" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="0,0 0.002,-0.002" data-type="line" data-label="" points="326.0264775512422,186.56330749353998 326.1642897820777,186.70111972437547" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="0.002,-0.002 0.002,-2.75716" data-type="line" data-label="" points="326.1642897820777,186.70111972437547 326.1642897820777,376.5484926787252" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="0.002,-2.75716 -0.07928,-2.83844" data-type="line" data-label="" points="326.1642897820777,376.5484926787252 320.5636007209235,382.1491817398794" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="-0.07928,-2.83844 -1.0936385109248044,-2.83844" data-type="line" data-label="" points="320.5636007209235,382.1491817398794 250.66809609216864,382.1491817398794" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="-1.0936385109248044,-2.83844 -1.1749185109248044,-2.91972" data-type="line" data-label="" points="250.66809609216864,382.1491817398794 245.06740703101445,387.7498708010336" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="-1.1749185109248044,-2.91972 -1.1749185109248044,-3.08228" data-type="line" data-label="" points="245.06740703101445,387.7498708010336 245.06740703101445,398.9512489233419" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="-1.1749185109248044,-3.08228 -1.0936385109248044,-3.16356" data-type="line" data-label="" points="245.06740703101445,398.9512489233419 250.66809609216864,404.5519379844961" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="-1.0936385109248044,-3.16356 -0.07928000000000002,-3.16356" data-type="line" data-label="" points="250.66809609216864,404.5519379844961 320.5636007209235,404.5519379844961" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="-0.07928000000000002,-3.16356 0.001999999999999988,-3.24484" data-type="line" data-label="" points="320.5636007209235,404.5519379844961 326.1642897820777,410.15262704565026" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="0.001999999999999988,-3.24484 0.002,-6" data-type="line" data-label="" points="326.1642897820777,410.15262704565026 326.1642897820777,600" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="-1,2 0,2" data-type="line" data-label="" points="257.1203621334988,48.75107665805331 326.0264775512422,48.75107665805331" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="0,2 1,1" data-type="line" data-label="" points="326.0264775512422,48.75107665805331 394.93259296898555,117.65719207579664" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><g><polyline data-points="1,1 1,-6" data-type="line" data-label="" points="394.93259296898555,117.65719207579664 394.93259296898555,600" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.600689061154179"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="326.0264775512422" cy="186.56330749353998" r="8.2687338501292" fill="blue" stroke="none" stroke-width="0.014512499999999998"/><circle data-type="circle" data-label="" data-x="0" data-y="2" cx="326.0264775512422" cy="48.75107665805331" r="8.2687338501292" fill="blue" stroke="none" stroke-width="0.014512499999999998"/><circle data-type="circle" data-label="" data-x="-1" data-y="0" cx="257.1203621334988" cy="186.56330749353998" r="8.751076658053403" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.014512499999999998"/><circle data-type="circle" data-label="" data-x="-1" data-y="2" cx="257.1203621334988" cy="48.75107665805331" r="8.751076658053403" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.014512499999999998"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":68.90611541774334,"c":0,"e":326.0264775512422,"b":0,"d":-68.90611541774334,"f":186.56330749353998};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>