top" data-x="2.489999999998758" data-y="11.329999999999984" cx="344.8412698411942" cy="614.999999999975" r="3" fill="hsl(0, 100%, 50%)"/></g><g><circle data-type="point" data-label="breakout:pcb_breakout_point_0
