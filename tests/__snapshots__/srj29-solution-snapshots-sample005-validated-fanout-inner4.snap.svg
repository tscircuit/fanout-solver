9999999999999" cx="246.69291338582678" cy="346.45669291338584" r="3.3070866141732282" fill="blue" stroke="none" stroke-width="0.04535714285714286"/><circle data-type="circle" data-label="" data-x="-3.1999999999999997" data-y="-1.1102230246251565e-16" cx="246.69291338582678" cy="364.09448818897636" r="3.3070866141732282" fill="blue" stroke="none" stroke-width="0.04535714285714286"/><circle data-type="circle" data-label="" data-x="3.1999999999999997" data-y="0.7999999999999999" cx="387.79527559055117" cy="346.45669291338584" r="3.3070866141732282" fill="blue" stroke="none" stroke-width="0.04535714285714286"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="4.2" cx="43.30708661417327" cy="271.496062992126" r="3.3070866141732282" fill="blue" stroke="none" stroke-width="0.04535714285714286"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="0.4" cx="43.30708661417327" cy="355.2755905511811" r="3.3070866141732282" fill="blue" stroke="none" stroke-width="0.04535714285714286"/><circle data-type="circle" data-label="" data-x="12.424999999999999" data-y="5.6" cx="591.1811023622047" cy="240.6299212598425" r="3.3070866141732282" fill="blue" stroke="none" stroke-width="0.04535714285714286"/><g><circle data-type="point" data-label="BUS_SIGNAL_RIGHT_02_019
