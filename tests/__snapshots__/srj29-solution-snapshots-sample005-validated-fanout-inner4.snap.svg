stroke-width="0.04491071428571428"/><circle data-type="circle" data-label="" data-x="-3.1999999999999997" data-y="-1.1102230246251565e-16" cx="248.74751491053678" cy="373.4393638170974" r="3.3399602385685885" fill="blue" stroke="none" stroke-width="0.04491071428571428"/><circle data-type="circle" data-label="" data-x="3.1999999999999997" data-y="0.7999999999999999" cx="391.2524850894632" cy="355.62624254473155" r="3.3399602385685885" fill="blue" stroke="none" stroke-width="0.04491071428571428"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="4.2" cx="43.33996023856861" cy="279.92047713717693" r="3.3399602385685885" fill="blue" stroke="none" stroke-width="0.04491071428571428"/><circle data-type="circle" data-label="" data-x="-12.424999999999999" data-y="0.4" cx="43.33996023856861" cy="364.53280318091447" r="3.3399602385685885" fill="blue" stroke="none" stroke-width="0.04491071428571428"/><circle data-type="circle" data-label="" data-x="12.424999999999999" data-y="5.6" cx="596.6600397614313" cy="248.74751491053678" r="3.3399602385685885" fill="blue" stroke="none" stroke-width="0.04491071428571428"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":22.266401590457257,"c":0,"e":320,"b":0,"d":-22.266401590457257,"f":373.4393638170974};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>