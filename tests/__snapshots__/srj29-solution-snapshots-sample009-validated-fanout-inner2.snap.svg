a-y="-0.21213203435596426" cx="212.23879417178904" cy="176.2227745910169" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="-1.0121320343559643" data-y="1.0121320343559643" cx="122.96953916154425" cy="86.95351958077211" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="-1.2" data-y="-0.40000000000000013" cx="109.27083333333331" cy="189.92148041922786" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="-1.0121320343559643" data-y="-1.0121320343559643" cx="122.96953916154425" cy="234.55610792435024" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="2" data-y="-2.8" cx="342.60416666666663" cy="364.9214804192278" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="-2" data-y="-1.2" cx="50.93749999999997" cy="248.25481375256118" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="-2" data-y="0.40000000000000013" cx="50.93749999999997" cy="131.5881470858945" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="2" data-y="-2" cx="342.60416666666663" cy="306.58814708589455" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="2.8" data-y="-1.2" cx="400.9375" cy="248.25481375256118" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="5.38" data-y="-0.3" cx="589.0625" cy="182.62981375256118" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="5.38" data-y="-1.6" cx="589.0625" cy="277.42148041922786" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="5.38" data-y="0.3" cx="589.0625" cy="138.87981375256118" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="-0.15" data-y="-5.38" cx="185.83333333333331" cy="553.0464804192279" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><circle data-type="circle" data-label="" data-x="0.15" data-y="-5.38" cx="207.70833333333331" cy="553.0464804192279" r="10.9375" fill="blue" stroke="none" stroke-width="0.013714285714285714"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":72.91666666666667,"c":0,"e":196.77083333333331,"b":0,"d":-72.91666666666667,"f":160.75481375256118};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>