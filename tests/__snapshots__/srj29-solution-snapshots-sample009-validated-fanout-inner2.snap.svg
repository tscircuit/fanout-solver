 data-y="0.8" cx="336" cy="200" r="24" fill="blue" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="-0.21213203435596426" data-y="0.21213203435596426" cx="350.05887450304573" cy="294.05887450304573" r="24" fill="blue" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="0.3999999999999997" data-y="-0.40000000000000013" cx="447.99999999999994" cy="392" r="24" fill="blue" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="-0.8" data-y="-1.1" cx="256" cy="504" r="24" fill="blue" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="0.3999999999999997" data-y="1.2" cx="447.99999999999994" cy="136" r="24" fill="blue" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="-0.8" data-y="0.5" cx="256" cy="248" r="24" fill="blue" stroke="none" stroke-width="0.00625"/><circle data-type="circle" data-label="" data-x="-0.6699999999999999" data-y="0" cx="276.8" cy="328" r="24" fill="blue" stroke="none" stroke-width="0.00625"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":160,"c":0,"e":384,"b":0,"d":-160,"f":328};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>