bottom" data-x="0.45" data-y="0.8" x="123.17192070198247" y="180.1364965875853" width="43.67890802729934" height="43.678908027299315" fill="rgba(255,0,0,0.9375)" stroke="black" stroke-width="0.005494642857142857"/></g><circle data-type="circle" data-label="" data-x="0.72928" data-y="0.25" cx="195.83906402339946" cy="302.0734481637959" r="21.839454013649657" fill="blue" stroke="none" stroke-width="0.005494642857142857"/><circle data-type="circle" data-label="" data-x="0.45" data-y="0.8" cx="145.01137471563214" cy="201.97595060123496" r="21.839454013649657" fill="blue" stroke="none" stroke-width="0.005494642857142857"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="63.11342216444592" cy="347.5723106922327" r="23.11342216444589" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005494642857142857"/><circle data-type="circle" data-label="" data-x="0.45" data-y="-0.6" cx="145.01137471563214" cy="456.76958076048095" r="23.11342216444589" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.005494642857142857"/><circle data-type="circle" data-label="" data-x="0.45" data-y="0.25" cx="145.01137471563214" cy="302.0734481637959" r="21.839454013649657" fill="rgba(255,0,0,0.9375)" stroke="black" stroke-width="0.005494642857142857"/><text data-type="text" data-label="Shared plane copper: original red, normalized blue" data-x="0.25" data-y="1.03" x="108.61228469288271" y="160.11699707507313" fill="black" font-size="16.379590510237243" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Shared plane copper: original red, normalized blue</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":181.99545011374715,"c":0,"e":63.11342216444592,"b":0,"d":-181.99545011374715,"f":347.5723106922327};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>