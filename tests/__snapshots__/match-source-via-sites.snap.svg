<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 0.5,0.5" data-type="line" data-label="" points="198.2608695652174,399.13043478260875 320,277.3913043478261" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><polyline data-points="0.5,0.5 0.5,0.5" data-type="line" data-label="" points="320,277.3913043478261 320,277.3913043478261" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><polyline data-points="0,1 -0.5,0.5" data-type="line" data-label="" points="198.2608695652174,155.6521739130435 76.52173913043478,277.3913043478261" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><polyline data-points="-0.5,0.5 -0.5,0.5" data-type="line" data-label="" points="76.52173913043478,277.3913043478261 76.52173913043478,277.3913043478261" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><polyline data-points="1,0 1.5,-0.5" data-type="line" data-label="" points="441.7391304347826,399.13043478260875 563.4782608695652,520.8695652173914" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><polyline data-points="1.5,-0.5 1.5,-0.5" data-type="line" data-label="" points="563.4782608695652,520.8695652173914 563.4782608695652,520.8695652173914" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><polyline data-points="1,1 1.5,0.5" data-type="line" data-label="" points="441.7391304347826,155.6521739130435 563.4782608695652,277.3913043478261" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><polyline data-points="1.5,0.5 1.5,0.5" data-type="line" data-label="" points="563.4782608695652,277.3913043478261 563.4782608695652,277.3913043478261" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="24.347826086956527"/></g><g><rect data-type="rect" data-label="top" data-x="0" data-y="0" x="125.21739130434781" y="326.0869565217392" width="146.08695652173918" height="146.08695652173913" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004107142857142857"/></g><g><rect data-type="rect" data-label="top" data-x="0" data-y="1" x="125.21739130434781" y="82.60869565217392" width="146.08695652173918" height="146.08695652173915" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004107142857142857"/></g><g><rect data-type="rect" data-label="top" data-x="1" data-y="0" x="368.695652173913" y="326.0869565217392" width="146.08695652173918" height="146.08695652173913" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004107142857142857"/></g><g><rect data-type="rect" data-label="top" data-x="1" data-y="1" x="368.695652173913" y="82.60869565217392" width="146.08695652173918" height="146.08695652173915" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.004107142857142857"/></g><circle data-type="circle" data-label="" data-x="0.5" data-y="0.5" cx="320" cy="277.3913043478261" r="36.52173913043479" fill="blue" stroke="none" stroke-width="0.004107142857142857"/><circle data-type="circle" data-label="" data-x="-0.5" data-y="0.5" cx="76.52173913043478" cy="277.3913043478261" r="36.52173913043479" fill="blue" stroke="none" stroke-width="0.004107142857142857"/><circle data-type="circle" data-label="" data-x="1.5" data-y="-0.5" cx="563.4782608695652" cy="520.8695652173914" r="36.52173913043479" fill="blue" stroke="none" stroke-width="0.004107142857142857"/><circle data-type="circle" data-label="" data-x="1.5" data-y="0.5" cx="563.4782608695652" cy="277.3913043478261" r="36.52173913043479" fill="blue" stroke="none" stroke-width="0.004107142857142857"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":243.47826086956525,"c":0,"e":198.2608695652174,"b":0,"d":-243.47826086956525,"f":399.13043478260875};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
