.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="-0.325" cx="295.6148946594806" cy="350.33904948554635" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-0.3251200000000005" data-y="-4.10272" cx="295.60803527682503" cy="566.2792748652621" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-4.02656" data-y="-4.10272" cx="84.0280908051609" cy="566.2792748652621" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-0.9750000000000001" data-y="0.325" cx="258.4599052751919" cy="313.18406010125756" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-0.9753600000000002" data-y="-3.7776" cx="258.4393271272252" cy="547.6949207904622" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-4.35168" data-y="-3.7776" cx="65.44373673036097" cy="547.6949207904622" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-1.625" data-y="-0.325" cx="221.30491589090315" cy="350.33904948554635" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-1.3004800000000003" data-y="-4.42784" cx="239.8549730524253" cy="584.8636289400621" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-4.6768" data-y="-4.42784" cx="46.859382655561035" cy="584.8636289400621" r="6.8593826555609985" fill="blue" stroke="none" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-1.95" data-y="0" cx="202.7274211987588" cy="331.76155479340196" r="8.57422831945125" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-1.3" data-y="0.65" cx="239.88241058304754" cy="294.6065654091132" r="8.57422831945125" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="-0.65" data-y="0" cx="277.0373999673363" cy="331.76155479340196" r="8.57422831945125" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.017494285714285716"/><circle data-type="circle" data-label="" data-x="0" data-y="0.65" cx="314.192389351625" cy="294.6065654091132" r="8.57422831945125" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.017494285714285716"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":57.16152212967499,"c":0,"e":314.192389351625,"b":0,"d":-57.16152212967499,"f":331.76155479340196};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>