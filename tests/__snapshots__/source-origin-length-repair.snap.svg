bottom" data-x="-2" data-y="-2" x="92.53097345132741" y="432" width="23.787610619469035" height="23.787610619469035" fill="rgba(255,0,0,0.875)" stroke="black" stroke-width="0.010089285714285714"/></g><circle data-type="circle" data-label="" data-x="-2.1132799999999996" data-y="0.48768000000000034" cx="93.1970265486726" cy="197.32729203539822" r="11.893805309734512" fill="blue" stroke="none" stroke-width="0.010089285714285714"/><circle data-type="circle" data-label="" data-x="-2.1132799999999996" data-y="-0.4876799999999999" cx="93.1970265486726" cy="294.00014159292033" r="11.893805309734512" fill="blue" stroke="none" stroke-width="0.010089285714285714"/><circle data-type="circle" data-label="" data-x="-2" data-y="-2" cx="104.42477876106193" cy="443.8938053097345" r="11.893805309734512" fill="blue" stroke="none" stroke-width="0.010089285714285714"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="0.5" cx="54.86725663716811" cy="196.1061946902655" r="14.86725663716814" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010089285714285714"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="-0.5" cx="54.86725663716811" cy="295.2212389380531" r="14.86725663716814" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010089285714285714"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="-2" cx="54.86725663716811" cy="443.8938053097345" r="14.86725663716814" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.010089285714285714"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":99.11504424778761,"c":0,"e":302.65486725663715,"b":0,"d":-99.11504424778761,"f":245.6637168141593};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>