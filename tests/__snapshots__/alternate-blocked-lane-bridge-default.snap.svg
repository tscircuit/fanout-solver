bottom" data-x="-3.6" data-y="2" x="59.92376111817025" y="287.2681067344346" width="17.077509529860237" height="17.077509529860265" fill="rgba(255,0,0,0.875)" stroke="black" stroke-width="0.014053571428571427"/></g><circle data-type="circle" data-label="" data-x="3.75" data-y="2.35" cx="591.4612452350699" cy="270.9021601016518" r="8.538754764930115" fill="blue" stroke="none" stroke-width="0.014053571428571427"/><circle data-type="circle" data-label="" data-x="3.75" data-y="1.35" cx="591.4612452350699" cy="342.05844980940276" r="8.538754764930115" fill="blue" stroke="none" stroke-width="0.014053571428571427"/><circle data-type="circle" data-label="" data-x="-3.6" data-y="2" cx="68.46251588310037" cy="295.8068614993647" r="8.538754764930115" fill="blue" stroke="none" stroke-width="0.014053571428571427"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":71.15628970775096,"c":0,"e":324.62515883100383,"b":0,"d":-71.15628970775096,"f":438.1194409148666};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>