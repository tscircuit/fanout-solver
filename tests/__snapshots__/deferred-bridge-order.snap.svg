"293.75" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="0.35" data-y="1.35" cx="344.5" cy="293.75" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="2.35" data-y="1.35" cx="484.5" cy="293.75" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="1.35" data-y="-0.65" cx="414.5" cy="433.75" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><circle data-type="circle" data-label="" data-x="-3.6" data-y="0.6" cx="68" cy="346.25" r="8.4" fill="blue" stroke="none" stroke-width="0.014285714285714285"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":70,"c":0,"e":320,"b":0,"d":-70,"f":388.25};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>