 437.43863393810034,316.63820704375667" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.9882604055496262"/></g><g><polyline data-points="3.3200000000000003,0.12 3.24,0.20000000000000007" data-type="line" data-label="" points="437.43863393810034,316.63820704375667 431.46211312700103,310.6616862326574" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.9882604055496262"/></g><g><polyline data-points="3.24,0.20000000000000007 3.12,0.20000000000000007" data-type="line" data-label="" points="431.46211312700103,310.6616862326574 422.49733191035216,310.6616862326574" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.9882604055496262"/></g><g><polyline data-points="3.12,0.20000000000000007 3,0.2" data-type="line" data-label="" points="422.49733191035216,310.6616862326574 413.53255069370323,310.6616862326574" fill="none" stroke="#d97706" stroke-linejoin="round" stroke-width="2.9882604055496262"/></g><circle data-type="circle" data-label="" data-x="0" data-y="-0.24" cx="189.4130202774813" cy="343.5325506937033" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="-1.6" data-y="-0.24" cx="69.88260405549626" cy="343.5325506937033" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="0" data-y="-0.08" cx="189.4130202774813" cy="331.5795090715048" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="-1.6" data-y="-0.08" cx="69.88260405549626" cy="331.5795090715048" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="0" data-y="0.08" cx="189.4130202774813" cy="319.6264674493063" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="-1.6" data-y="0.08" cx="69.88260405549626" cy="319.6264674493063" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="5" data-y="-0.24" cx="562.9455709711846" cy="343.5325506937033" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="3.4" data-y="-0.24" cx="443.41515474919953" cy="343.5325506937033" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="5" data-y="-0.08" cx="562.9455709711846" cy="331.5795090715048" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="3.4" data-y="-0.08" cx="443.41515474919953" cy="331.5795090715048" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="5" data-y="0.08" cx="562.9455709711846" cy="319.6264674493063" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><circle data-type="circle" data-label="" data-x="3.4" data-y="0.08" cx="443.41515474919953" cy="319.6264674493063" r="2.9882604055496262" fill="#334155" stroke="black" stroke-width="0.013385714285714287"/><text data-type="text" data-label="Before: transit returns inside strip" data-x="-2" data-y="0.65" x="40" y="277.0437566702241" fill="black" font-size="9.711846318036285" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: transit returns inside strip</text><text data-type="text" data-label="After: original barrels retained" data-x="3" data-y="0.65" x="413.53255069370323" y="277.0437566702241" fill="black" font-size="9.711846318036285" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: original barrels retained</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":74.70651013874065,"c":0,"e":189.4130202774813,"b":0,"d":-74.70651013874065,"f":325.60298826040554};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>