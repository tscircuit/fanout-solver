r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-0.18786796564403577" data-y="-0.18786796564403577" cx="289.94112549695427" cy="358.05887450304573" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="0.26999999999999996" data-y="-0.4" cx="363.2" cy="392" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="-0.18786796564403577" data-y="1.4121320343559642" cx="289.94112549695427" cy="102.05887450304567" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><circle data-type="circle" data-label="" data-x="0.26999999999999996" data-y="1.2" cx="363.2" cy="135.99999999999997" r="24.000000000000004" fill="blue" stroke="none" stroke-width="0.006249999999999999"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":160.00000000000003,"c":0,"e":320,"b":0,"d":-160.00000000000003,"f":328};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>