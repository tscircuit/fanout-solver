bel="" data-x="-1.4121320343559642" data-y="-0.18786796564403577" cx="71.7157287525381" cy="338.3823954192047" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="1.5999999999999999" data-y="-5.551115123125783e-17" cx="473.33333333333337" cy="313.3333333333333" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="1.4121320343559642" data-y="-0.18786796564403577" cx="448.2842712474619" cy="338.3823954192047" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="0.4" cx="60" cy="260" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="-0.18786796564403577" data-y="-0.6121320343559643" cx="234.95093791412856" cy="394.95093791412853" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="0.18786796564403577" data-y="-0.6121320343559643" cx="285.0490620858714" cy="394.95093791412853" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="0.8" data-y="-0.8" cx="366.6666666666667" cy="420" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="0.10000000000000003" data-y="-1.2" cx="273.3333333333333" cy="473.3333333333333" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="-5.551115123125783e-17" data-y="0.8" cx="260" cy="206.66666666666663" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="-0.18786796564403577" data-y="0.9878679656440357" cx="234.95093791412856" cy="181.61760458079522" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="0.8" data-y="0.8" cx="366.6666666666667" cy="206.66666666666663" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="1.2" data-y="1.5" cx="420" cy="113.33333333333331" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="1.4121320343559642" data-y="-0.9878679656440357" cx="448.2842712474619" cy="445.0490620858714" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="-1.4121320343559642" data-y="0.9878679656440357" cx="71.7157287525381" cy="181.61760458079522" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><circle data-type="circle" data-label="" data-x="2.4" data-y="0" cx="580" cy="313.3333333333333" r="20" fill="blue" stroke="none" stroke-width="0.0075"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":133.33333333333334,"c":0,"e":260,"b":0,"d":-133.33333333333334,"f":313.3333333333333};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>