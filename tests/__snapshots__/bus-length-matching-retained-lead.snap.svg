" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="9.10336"/></g><g><polyline data-points="2.9550400000000003,0.9144000000000001 2.9753600000000002,0.9347200000000001" data-type="line" data-label="" points="482.96448000000004,406.86719999999997 485.24032,404.59135999999995" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="9.10336"/></g><g><polyline data-points="2.9753600000000002,0.9347200000000001 2.9753600000000002,0.9753600000000001" data-type="line" data-label="" points="485.24032,404.59135999999995 485.24032,400.03968" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="9.10336"/></g><g><polyline data-points="2.9753600000000002,0.9753600000000001 4,0.97536" data-type="line" data-label="" points="485.24032,400.03968 600,400.03968" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="9.10336"/></g><g><polyline data-points="-1,2 0,2" data-type="line" data-label="" points="40,285.28 152,285.28" fill="none" stroke="#e57d19" stroke-linejoin="round" stroke-width="9.10336"/></g><g><polyline data-points="0,2 0,3" data-type="line" data-label="" points="152,285.28 152,173.27999999999997" fill="none" stroke="#e57d19" stroke-linejoin="round" stroke-width="9.10336"/></g><g><polyline data-points="0,3 0.5,3.5" data-type="line" data-label="" points="152,173.27999999999997 208,117.27999999999997" fill="none" stroke="#e57d19" stroke-linejoin="round" stroke-width="9.10336"/></g><g><polyline data-points="0.5,3.5 4,3.5" data-type="line" data-label="" points="208,117.27999999999997 600,117.27999999999997" fill="none" stroke="#e57d19" stroke-linejoin="round" stroke-width="9.10336"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="152" cy="509.28" r="13.44" fill="#334155" stroke="black" stroke-width="0.008928571428571428"/><circle data-type="circle" data-label="" data-x="0" data-y="2" cx="152" cy="285.28" r="13.44" fill="#334155" stroke="black" stroke-width="0.008928571428571428"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":112,"c":0,"e":152,"b":0,"d":-112,"f":509.28};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>