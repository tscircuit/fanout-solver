bottom" data-x="-1.6" data-y="1.4" x="71.55452436194892" y="272.2041763341067" width="11.136890951276115" height="11.136890951276087" fill="rgba(255,0,0,0.9375)" stroke="black" stroke-width="0.02155"/></g><circle data-type="circle" data-label="" data-x="-2.1" data-y="-2.6" cx="53.92111368909511" cy="463.38747099767977" r="5.568445475638051" fill="blue" stroke="none" stroke-width="0.02155"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="151.368909512761" cy="342.737819025522" r="5.568445475638051" fill="blue" stroke="none" stroke-width="0.02155"/><circle data-type="circle" data-label="" data-x="0" data-y="-1.8" cx="151.368909512761" cy="426.2645011600928" r="5.568445475638051" fill="blue" stroke="none" stroke-width="0.02155"/><circle data-type="circle" data-label="" data-x="-1.6" data-y="1.4" cx="77.12296983758698" cy="277.77262180974475" r="5.568445475638051" fill="blue" stroke="none" stroke-width="0.02155"/><text data-type="text" data-label="Before: 90 degree stub" data-x="6.5" data-y="3.7" x="452.99303944315545" y="171.04408352668207" fill="black" font-size="10.208816705336428" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: 90 degree stub</text><text data-type="text" data-label="After: 45 degree chamfer" data-x="6.5" data-y="-0.30000000000000004" x="452.99303944315545" y="356.65893271461715" fill="black" font-size="10.208816705336428" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: 45 degree chamfer</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":46.40371229698376,"c":0,"e":151.368909512761,"b":0,"d":-46.40371229698376,"f":342.737819025522};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>