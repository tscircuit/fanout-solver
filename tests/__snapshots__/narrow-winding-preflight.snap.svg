bottom" data-x="-0.7" data-y="-0.7" x="272.4" y="378.79999999999995" width="16.80000000000001" height="16.80000000000001" fill="rgba(255,0,0,0.875)" stroke="black" stroke-width="0.017857142857142856"/></g><circle data-type="circle" data-label="" data-x="0.3" data-y="0.55" cx="336.8" cy="317.2" r="8.4" fill="blue" stroke="none" stroke-width="0.017857142857142856"/><circle data-type="circle" data-label="" data-x="0.3" data-y="-0.10000000000000003" cx="336.8" cy="353.6" r="8.4" fill="blue" stroke="none" stroke-width="0.017857142857142856"/><circle data-type="circle" data-label="" data-x="-0.7" data-y="-0.7" cx="280.8" cy="387.2" r="8.4" fill="blue" stroke="none" stroke-width="0.017857142857142856"/><text data-type="text" data-label="Blocked pair corner tracks" data-x="-2.5" data-y="2.5" x="180" y="208" fill="#dc2626" font-size="12.32" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Blocked pair corner tracks</text><text data-type="text" data-label="Accepted copper" data-x="-1" data-y="1.8" x="264" y="247.2" fill="#2563eb" font-size="12.32" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Accepted copper</text><text data-type="text" data-label="Ordered pair" data-x="-3" data-y="0.3" x="152" y="331.2" fill="#2563eb" font-size="10.08" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Ordered pair</text><text data-type="text" data-label="Plain-edge singleton" data-x="-3" data-y="-1.7" x="152" y="443.2" fill="#2563eb" font-size="12.32" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Plain-edge singleton</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56,"c":0,"e":320,"b":0,"d":-56,"f":348};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>