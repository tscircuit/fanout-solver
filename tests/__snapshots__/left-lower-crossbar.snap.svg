e data-type="circle" data-label="" data-x="0.9750000000000001" data-y="0.325" cx="511.2676056338029" cy="156.40625352112673" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="0.9753599999999998" data-y="-3.69441" cx="511.29600000000005" cy="473.4301408450704" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="-4.43487" data-y="-3.69441" cx="84.57363380281686" cy="473.4301408450704" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="0.325" data-y="-0.325" cx="460.00000000000006" cy="207.67385915492954" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="0.32511999999999963" data-y="-4.17827" cx="460.0094647887324" cy="511.5937464788733" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="-4.19294" data-y="-4.17827" cx="103.65543661971827" cy="511.5937464788733" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="0.325" cx="408.7323943661972" cy="156.40625352112673" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="0.6502399999999997" data-y="-3.45248" cx="485.65273239436624" cy="454.348338028169" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="-3.95101" data-y="-3.45248" cx="122.73723943661969" cy="454.348338028169" r="9.464788732394366" fill="blue" stroke="none" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="1.95" data-y="0" cx="588.1690140845071" cy="182.04005633802814" r="11.830985915492958" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="1.3" data-y="0.65" cx="536.9014084507043" cy="130.77245070422532" r="11.830985915492958" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="0.65" data-y="0" cx="485.63380281690144" cy="182.04005633802814" r="11.830985915492958" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.012678571428571428"/><circle data-type="circle" data-label="" data-x="0" data-y="0.65" cx="434.3661971830986" cy="130.77245070422532" r="11.830985915492958" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.012678571428571428"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":78.87323943661973,"c":0,"e":434.3661971830986,"b":0,"d":-78.87323943661973,"f":182.04005633802814};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>