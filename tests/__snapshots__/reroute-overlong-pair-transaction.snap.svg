bottom" data-x="-0.6" data-y="0.9" x="177.62711864406782" y="186.32768361581918" width="22.146892655367196" height="22.146892655367225" fill="rgba(255,0,0,0.875)" stroke="black" stroke-width="0.006321428571428572"/></g><circle data-type="circle" data-label="" data-x="-1.25" data-y="-0.5" cx="85.87570621468927" cy="418.87005649717514" r="11.073446327683616" fill="blue" stroke="none" stroke-width="0.006321428571428572"/><circle data-type="circle" data-label="" data-x="-1.25" data-y="0.5" cx="85.87570621468927" cy="260.6779661016949" r="11.073446327683616" fill="blue" stroke="none" stroke-width="0.006321428571428572"/><circle data-type="circle" data-label="" data-x="-0.6" data-y="0.9" cx="188.70056497175142" cy="197.4011299435028" r="11.073446327683616" fill="blue" stroke="none" stroke-width="0.006321428571428572"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="-0.5" cx="46.32768361581924" cy="418.87005649717514" r="6.327683615819209" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.006321428571428572"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="0.5" cx="46.32768361581924" cy="260.6779661016949" r="6.327683615819209" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.006321428571428572"/><circle data-type="circle" data-label="" data-x="-0.85" data-y="0.9" cx="149.15254237288138" cy="197.4011299435028" r="6.327683615819209" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.006321428571428572"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":158.19209039548022,"c":0,"e":283.61581920903956,"b":0,"d":-158.19209039548022,"f":339.774011299435};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>