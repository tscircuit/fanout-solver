idth="11.853333333333332"/></g><g><polyline data-points="5.9374400000000005,0 6.1,0" data-type="line" data-label="" points="424.62666666666667,400.2083333333333 448.33333333333314,400.2083333333333" fill="none" stroke="#f97316" stroke-linejoin="round" stroke-width="5.926666666666666" stroke-dasharray="dashed"/></g><circle data-type="circle" data-label="" data-x="3.73888" data-y="0" cx="104.00333333333322" cy="400.2083333333333" r="17.499999999999996" fill="#334155" stroke="black" stroke-width="0.006857142857142858"/><circle data-type="circle" data-label="" data-x="3.82" data-y="1" cx="115.83333333333326" cy="254.375" r="17.499999999999996" fill="#334155" stroke="black" stroke-width="0.006857142857142858"/><circle data-type="circle" data-label="" data-x="5.83888" data-y="-0.24383999999999983" cx="410.2533333333332" cy="435.7683333333333" r="17.499999999999996" fill="#334155" stroke="black" stroke-width="0.006857142857142858"/><circle data-type="circle" data-label="" data-x="5.92" data-y="1" cx="422.08333333333326" cy="254.375" r="17.499999999999996" fill="#334155" stroke="black" stroke-width="0.006857142857142858"/><text data-type="text" data-label="Before: via crowds later exit" data-x="3.3" data-y="1.6" x="39.999999999999886" y="166.875" fill="black" font-size="14.583333333333332" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: via crowds later exit</text><text data-type="text" data-label="After: approach remains clear" data-x="5.4" data-y="1.6" x="346.25" y="166.875" fill="black" font-size="14.583333333333332" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: approach remains clear</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":145.83333333333331,"c":0,"e":-441.25,"b":0,"d":-145.83333333333331,"f":400.2083333333333};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>