<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-5,0 -5,5" data-type="line" data-label="" points="90.9090909090909,421.8181818181818 90.9090909090909,167.27272727272728" fill="none" stroke="#86b697" stroke-linejoin="round" stroke-width="1.781818181818182"/></g><g><polyline data-points="-5,-1 -5,0" data-type="line" data-label="" points="90.9090909090909,472.72727272727275 90.9090909090909,421.8181818181818" fill="none" stroke="#b0b0b0" stroke-linejoin="round" stroke-width="1.781818181818182"/></g><g><polyline data-points="-5,0 1,0" data-type="line" data-label="" points="90.9090909090909,421.8181818181818 396.3636363636364,421.8181818181818" fill="none" stroke="#a0a0a0" stroke-linejoin="round" stroke-width="1.2727272727272727" stroke-dasharray="0.1 0.1"/></g><g><polyline data-points="0,-0.4 0.3,-0.1" data-type="line" data-label="" points="345.45454545454544,442.1818181818182 360.7272727272727,426.9090909090909" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="5.090909090909091"/></g><g><polyline data-points="0.3,-0.1 0.19999999999999998,0" data-type="line" data-label="" points="360.7272727272727,426.9090909090909 355.6363636363636,421.8181818181818" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.090909090909091"/></g><g><polyline data-points="0.19999999999999998,0 0.10000000000000053,0" data-type="line" data-label="" points="355.6363636363636,421.8181818181818 350.54545454545456,421.8181818181818" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.090909090909091"/></g><g><polyline data-points="0.10000000000000053,0 -0.2999999999999998,0.40000000000000036" data-type="line" data-label="" points="350.54545454545456,421.8181818181818 330.1818181818182,401.45454545454544" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="5.090909090909091"/></g><g><polyline data-points="-0.299999999999999