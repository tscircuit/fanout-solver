#dc2626" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="7,1.98 7,1.02" data-type="line" data-label="" points="382.5242718446602,342.8349514563107 382.5242718446602,395.02912621359224" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="7,1.02 7.02,1" data-type="line" data-label="" points="382.5242718446602,395.02912621359224 383.6116504854368,396.11650485436894" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="7.02,1 8,1" data-type="line" data-label="" points="383.6116504854368,396.11650485436894 436.8932038834951,396.11650485436894" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="8,1 9.129999999999999,2.13" data-type="line" data-label="" points="436.8932038834951,396.11650485436894 498.33009708737853,334.6796116504854" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="9.129999999999999,2.13 10,2.13" data-type="line" data-label="" points="498.33009708737853,334.6796116504854 545.6310679611651,334.6796116504854" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="10,2.13 11,2.13" data-type="line" data-label="" points="545.6310679611651,334.6796116504854 600,334.6796116504854" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><text data-type="text" data-label="Accepted: clear terminal entry" data-x="0.7" data-y="3.8" x="39.99999999999999" y="243.8834951456311" fill="black" font-size="9.78640776699029" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Accepted: clear terminal entry</text><text data-type="text" data-label="Rejected: entry touches an earlier arm" data-x="6.7" data-y="3.8" x="366.2135922330097" y="243.8834951456311" fill="black" font-size="9.78640776699029" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Rejected: entry touches an earlier arm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":54.36893203883495,"c":0,"e":1.9417475728155296,"b":0,"d":-54.36893203883495,"f":450.4854368932039};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>