<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="4,3.5 4,3" data-type="line" data-label="" points="219.41747572815532,260.19417475728153 219.41747572815532,287.37864077669906" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="4,3 1.02,3" data-type="line" data-label="" points="219.41747572815532,287.37864077669906 57.39805825242718,287.37864077669906" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="1.02,3 1,2.98" data-type="line" data-label="" points="57.39805825242718,287.37864077669906 56.31067961165048,288.46601941747576" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="1,2.98 1,1.02" data-type="line" data-label="" points="56.31067961165048,288.46601941747576 56.31067961165048,395.02912621359224" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="1,1.02 1.02,1" data-type="line" data-label="" points="56.31067961165048,395.02912621359224 57.39805825242718,396.11650485436894" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="1.02,1 2,1" data-type="line" data-label="" points="57.39805825242718,396.11650485436894 110.67961165048543,396.11650485436894" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="2,1 3.13,2.13" data-type="line" data-label="" points="110.67961165048543,396.11650485436894 172.1165048543689,334.6796116504854" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="4.4191067961165045"/></g><g><polyline data-points="3.13,2.13 4,2.13" data-type="line" data-label="" points="172.1165048543689,334.6796116504854 219.41747572815532,334.6