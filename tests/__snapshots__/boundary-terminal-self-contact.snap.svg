" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="7,1.98 7,1.02" data-type="line" data-label="" points="256.1764705882353,334.4117647058824 256.1764705882353,367.3529411764706" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="7,1.02 7.02,1" data-type="line" data-label="" points="256.1764705882353,367.3529411764706 256.8627450980392,368.03921568627453" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="7.02,1 8,1" data-type="line" data-label="" points="256.8627450980392,368.03921568627453 290.4901960784314,368.03921568627453" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="8,1 9.129999999999999,2.13" data-type="line" data-label="" points="290.4901960784314,368.03921568627453 329.2647058823529,329.264705882353" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="9.129999999999999,2.13 10,2.13" data-type="line" data-label="" points="329.2647058823529,329.264705882353 359.11764705882354,329.264705882353" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="10,2.13 11,2.13" data-type="line" data-label="" points="359.11764705882354,329.264705882353 393.4313725490196,329.264705882353" fill="none" stroke="#dc2626" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="16,3.5 16,3" data-type="line" data-label="" points="565,282.2549019607843 565,299.4117647058824" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="16,3 15,3" data-type="line" data-label="" points="565,299.4117647058824 530.686274509804,299.4117647058824" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="15,3 15,2" data-type="line" data-label="" points="530.686274509804,299.4117647058824 530.686274509804,333.72549019607845" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="15,2 13,2" data-type="line" data-label="" points="530.686274509804,333.72549019607845 462.05882352941177,333.72549019607845" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="13,2 13,1" data-type="line" data-label="" points="462.05882352941177,333.72549019607845 462.05882352941177,368.03921568627453" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="13,1 14,1" data-type="line" data-label="" points="462.05882352941177,368.03921568627453 496.37254901960785,368.03921568627453" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="14,1 14.870000000000001,1" data-type="line" data-label="" points="496.37254901960785,368.03921568627453 526.2254901960785,368.03921568627453" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="14.870000000000001,1 16,2.13" data-type="line" data-label="" points="526.2254901960785,368.03921568627453 565,329.264705882353" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><g><polyline data-points="16,2.13 17,2.13" data-type="line" data-label="" points="565,329.264705882353 599.313725490196,329.264705882353" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="2.7890196078431373"/></g><text data-type="text" data-label="Accepted: clear terminal entry" data-x="0.7" data-y="3.8" x="40.000000000000014" y="271.9607843137255" fill="black" font-size="6.1764705882352935" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Accepted: clear terminal entry</text><text data-type="text" data-label="Rejected: entry touches an earlier arm" data-x="6.7" data-y="3.8" x="245.8823529411765" y="271.9607843137255" fill="black" font-size="6.1764705882352935" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Rejected: entry touches an earlier arm</text><text data-type="text" data-label="Accepted: alternate entry clears the arm" data-x="12.7" data-y="3.8" x="451.7647058823529" y="271.9607843137255" fill="black" font-size="6.1764705882352935" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Accepted: alternate entry clears the arm</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":34.31372549019608,"c":0,"e":15.980392156862763,"b":0,"d":-34.31372549019608,"f":402.3529411764706};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>