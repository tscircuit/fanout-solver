.32511999999999963" data-y="-4.4240200000000005" cx="332.864" cy="577.7557142857142" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-3.95101" data-y="-4.4240200000000005" cx="88.51371428571429" cy="577.7557142857142" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-0.325" data-y="-0.325" cx="295.7142857142857" cy="343.52599999999995" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-0.3251200000000005" data-y="-4.6659500000000005" cx="295.7074285714285" cy="591.5802857142858" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-4.19294" data-y="-4.6659500000000005" cx="74.68914285714285" cy="591.5802857142858" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-0.9750000000000001" data-y="0.325" cx="258.57142857142856" cy="306.38314285714284" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-4.440892098500626e-16" data-y="-3.94016" cx="314.2857142857143" cy="550.1065714285714" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-4.43487" data-y="-3.94016" cx="60.86457142857142" cy="550.1065714285714" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-1.625" data-y="-0.325" cx="221.42857142857144" cy="343.52599999999995" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-0.6502400000000002" data-y="-4.1820900000000005" cx="277.1291428571428" cy="563.9311428571428" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-4.6768" data-y="-4.1820900000000005" cx="47.04000000000002" cy="563.9311428571428" r="6.857142857142857" fill="blue" stroke="none" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-1.95" data-y="0" cx="202.85714285714286" cy="324.9545714285714" r="8.571428571428571" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-1.3" data-y="0.65" cx="240" cy="287.8117142857143" r="8.571428571428571" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="-0.65" data-y="0" cx="277.1428571428571" cy="324.9545714285714" r="8.571428571428571" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0175"/><circle data-type="circle" data-label="" data-x="0" data-y="0.65" cx="314.2857142857143" cy="287.8117142857143" r="8.571428571428571" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0175"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":57.14285714285714,"c":0,"e":314.2857142857143,"b":0,"d":-57.14285714285714,"f":324.9545714285714};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>