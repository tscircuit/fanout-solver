ll="#0891b2" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="0.9" data-y="1.5" cx="161.57394843962007" cy="254.1474445952058" r="2.7860696517412937" fill="#0891b2" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="5.5" data-y="-0.9" cx="394.59068294889187" cy="375.7213930348259" r="2.7860696517412937" fill="#059669" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="5.5" data-y="0" cx="394.59068294889187" cy="330.13116236996837" r="2.7860696517412937" fill="#059669" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="5.5" data-y="0.9" cx="394.59068294889187" cy="284.54093170511084" r="2.7860696517412937" fill="#059669" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="3.1" data-y="1.5" cx="273.0167345092718" cy="254.1474445952058" r="2.7860696517412937" fill="#db2777" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="4" data-y="1.5" cx="318.60696517412936" cy="254.1474445952058" r="2.7860696517412937" fill="#db2777" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="4.9" data-y="1.5" cx="364.1971958389869" cy="254.1474445952058" r="2.7860696517412937" fill="#db2777" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="9.5" data-y="-0.9" cx="597.2139303482587" cy="375.7213930348259" r="2.7860696517412937" fill="#2563eb" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="9.5" data-y="0" cx="597.2139303482587" cy="330.13116236996837" r="2.7860696517412937" fill="#2563eb" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="9.5" data-y="0.9" cx="597.2139303482587" cy="284.54093170511084" r="2.7860696517412937" fill="#2563eb" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="7.1" data-y="1.5" cx="475.6399819086387" cy="254.1474445952058" r="2.7860696517412937" fill="#9333ea" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="8" data-y="1.5" cx="521.2302125734961" cy="254.1474445952058" r="2.7860696517412937" fill="#9333ea" stroke="black" stroke-width="0.019741071428571427"/><circle data-type="circle" data-label="" data-x="8.9" data-y="1.5" cx="566.8204432383537" cy="254.1474445952058" r="2.7860696517412937" fill="#9333ea" stroke="black" stroke-width="0.019741071428571427"/><text data-type="text" data-label="inner2" data-x="0" data-y="1.8" x="115.98371777476254" y="238.9507010402533" fill="black" font-size="10.131162369968342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">inner2</text><text data-type="text" data-label="inner3" data-x="4" data-y="1.8" x="318.60696517412936" y="238.9507010402533" fill="black" font-size="10.131162369968342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">inner3</text><text data-type="text" data-label="bottom" data-x="8" data-y="1.8" x="521.2302125734961" y="238.9507010402533" fill="black" font-size="10.131162369968342" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">bottom</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":50.655811849841704,"c":0,"e":115.98371777476254,"b":0,"d":-50.655811849841704,"f":330.13116236996837};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>