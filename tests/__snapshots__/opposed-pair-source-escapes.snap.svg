68421052" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="-0.65" data-y="0.65" cx="251.57894736842104" cy="215.78947368421052" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="0" data-y="0.65" cx="320" cy="215.78947368421052" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="0.65" data-y="0.65" cx="388.42105263157896" cy="215.78947368421052" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="1.3" data-y="0.65" cx="456.8421052631579" cy="215.78947368421052" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="-1.3" data-y="1.3" cx="183.1578947368421" cy="147.3684210526316" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="-0.65" data-y="1.3" cx="251.57894736842104" cy="147.3684210526316" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="0" data-y="1.3" cx="320" cy="147.3684210526316" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="0.65" data-y="1.3" cx="388.42105263157896" cy="147.3684210526316" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><circle data-type="circle" data-label="" data-x="1.3" data-y="1.3" cx="456.8421052631579" cy="147.3684210526316" r="15.789473684210524" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0095"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":105.26315789473684,"c":0,"e":320,"b":0,"d":-105.26315789473684,"f":284.2105263157895};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>