/><circle data-type="circle" data-label="" data-x="-1" data-y="-0.4" cx="47.14893617021278" cy="393.27659574468083" r="7.1489361702127665" fill="#64748b" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-1" data-y="0" cx="47.14893617021278" cy="345.6170212765957" r="7.1489361702127665" fill="#64748b" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-1" data-y="0.40000000000000013" cx="47.14893617021278" cy="297.9574468085106" r="7.1489361702127665" fill="#64748b" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-1" data-y="0.8" cx="47.14893617021278" cy="250.2978723404255" r="7.1489361702127665" fill="#64748b" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-0.6" data-y="-0.8" cx="94.80851063829789" cy="440.93617021276594" r="9.531914893617023" fill="#ffffff" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-0.6" data-y="-0.4" cx="94.80851063829789" cy="393.27659574468083" r="9.531914893617023" fill="#ffffff" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-0.6" data-y="0" cx="94.80851063829789" cy="345.6170212765957" r="9.531914893617023" fill="#ffffff" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-0.6" data-y="0.40000000000000013" cx="94.80851063829789" cy="297.9574468085106" r="9.531914893617023" fill="#ffffff" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="-0.6" data-y="0.8" cx="94.80851063829789" cy="250.2978723404255" r="9.531914893617023" fill="#ffffff" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="2.55" data-y="0.4" cx="470.1276595744681" cy="297.9574468085106" r="6.553191489361703" fill="#2563eb" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="2.55" data-y="0.8" cx="470.1276595744681" cy="250.2978723404255" r="6.553191489361703" fill="#2563eb" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="2.8" data-y="0.6" cx="499.91489361702133" cy="274.12765957446805" r="6.553191489361703" fill="#059669" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="3.05" data-y="0.6" cx="529.7021276595744" cy="274.12765957446805" r="6.553191489361703" fill="#d97706" stroke="black" stroke-width="0.008392857142857141"/><circle data-type="circle" data-label="" data-x="3.05" data-y="1" cx="529.7021276595744" cy="226.46808510638294" r="6.553191489361703" fill="#d97706" stroke="black" stroke-width="0.008392857142857141"/><text data-type="text" data-label="Validated bottom-layer routes" data-x="0.6" data-y="1.35" x="237.78723404255322" y="184.76595744680847" fill="black" font-size="19.063829787234045" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Validated bottom-layer routes</text><text data-type="text" data-label="Overlapping requests" data-x="2.8" data-y="1.35" x="499.91489361702133" y="184.76595744680847" fill="black" font-size="16.68085106382979" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Overlapping requests</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":119.14893617021278,"c":0,"e":166.29787234042556,"b":0,"d":-119.14893617021278,"f":345.6170212765957};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>