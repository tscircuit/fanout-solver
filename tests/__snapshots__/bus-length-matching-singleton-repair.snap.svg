"" points="326.5429582884409,599.9586270586423 326.5015853470834,600" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.005818069878405"/></g><circle data-type="circle" data-label="" data-x="-5.25" data-y="-3.75" cx="342.7042635062337" cy="179.63367708172996" r="10.343235339387407" fill="blue" stroke="none" stroke-width="0.011601785714285716"/><circle data-type="circle" data-label="" data-x="-5.75" data-y="-3.25" cx="299.6074495921195" cy="136.53686316761576" r="10.343235339387407" fill="blue" stroke="none" stroke-width="0.011601785714285716"/><circle data-type="circle" data-label="" data-x="-5.25" data-y="-2.75" cx="342.7042635062337" cy="93.44004925350157" r="10.343235339387407" fill="blue" stroke="none" stroke-width="0.011601785714285716"/><circle data-type="circle" data-label="" data-x="-5.25" data-y="-2.25" cx="342.7042635062337" cy="50.34323533938738" r="10.343235339387407" fill="blue" stroke="none" stroke-width="0.011601785714285716"/><circle data-type="circle" data-label="" data-x="-5" data-y="-3.5" cx="364.2526704632908" cy="158.0852701246729" r="10.946590734185007" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.011601785714285716"/><circle data-type="circle" data-label="" data-x="-5.5" data-y="-3" cx="321.15585654917663" cy="114.9884562105587" r="10.946590734185007" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.011601785714285716"/><circle data-type="circle" data-label="" data-x="-5" data-y="-3" cx="364.2526704632908" cy="114.9884562105587" r="10.946590734185007" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.011601785714285716"/><circle data-type="circle" data-label="" data-x="-5.5" data-y="-2.5" cx="321.15585654917663" cy="71.89164229644447" r="10.946590734185007" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.011601785714285716"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":86.1936278282284,"c":0,"e":795.2208096044328,"b":0,"d":-86.1936278282284,"f":-143.59242727412652};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
