ata-y="1.5" cx="216.85983557248852" cy="256.27431321435733" r="4.21094846601163" fill="#fff" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.1" data-y="1" cx="70.88028875075202" cy="284.3473029877682" r="8.42189693202326" fill="#495057" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.1" data-y="1" cx="70.88028875075202" cy="284.3473029877682" r="4.21094846601163" fill="#fff" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.1" data-y="-2.9" cx="70.88028875075202" cy="503.31662322037295" r="8.42189693202326" fill="#495057" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.1" data-y="-2.9" cx="70.88028875075202" cy="503.31662322037295" r="4.21094846601163" fill="#fff" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="0.5" cx="160.71385602566676" cy="312.42029276117904" r="8.42189693202326" fill="#495057" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-2.5" data-y="0.5" cx="160.71385602566676" cy="312.42029276117904" r="4.21094846601163" fill="#fff" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.5" data-y="-0.7999999999999998" cx="48.42189693202329" cy="385.4100661720473" r="8.42189693202326" fill="#495057" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.5" data-y="-0.7999999999999998" cx="48.42189693202329" cy="385.4100661720473" r="4.21094846601163" fill="#fff" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.5" data-y="-2.0999999999999996" cx="48.42189693202329" cy="458.39983958291555" r="8.42189693202326" fill="#495057" stroke="black" stroke-width="0.017810714285714287"/><circle data-type="circle" data-label="" data-x="-4.5" data-y="-2.0999999999999996" cx="48.42189693202329" cy="458.39983958291555" r="4.21094846601163" fill="#fff" stroke="black" stroke-width="0.017810714285714287"/><text data-type="text" data-label="Permuted targets connected through a two-layer crossbar" data-x="0" data-y="3.65" x="301.0788048927211" y="135.5604571886906" fill="black" font-size="14.597954682173652" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Permuted targets connected through a two-layer crossbar</text><text data-type="text" data-label="bottom" data-x="-2.7" data-y="3.2" x="149.48466011630242" y="160.82614798476035" fill="#d9480f" font-size="12.913575295769" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">bottom</text><text data-type="text" data-label="inner5" data-x="-0.8" data-y="3.2" x="256.1620212552637" y="160.82614798476035" fill="#1971c2" font-size="12.913575295769" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">inner5</text><text data-type="text" data-label="TOP source prefix" data-x="1.4" data-y="3.2" x="379.68317625827154" y="160.82614798476035" fill="#868e96" font-size="12.913575295769" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TOP source prefix</text><text data-type="text" data-label="A" data-x="5.18" data-y="-2.5" x="591.9149789452576" y="480.8582314016443" fill="#d9480f" font-size="13.475035091237215" font-family="sans-serif" text-anchor="start" dominant-baseline="central">A</text><text data-type="text" data-label="A" data-x="-1.85" data-y="1.72" x="197.2087427311009" y="243.92219771405655" fill="#495057" font-size="13.475035091237215" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">A</text><text data-type="text" data-label="B" data-x="5.18" data-y="-2.9" x="591.9149789452576" y="503.31662322037295" fill="#d9480f" font-size="13.475035091237215" font-family="sans-serif" text-anchor="start" dominant-baseline="central">B</text><text data-type="text" data-label="B" data-x="-0.85" data-y="0.72" x="253.35472227792263" y="300.06817726087826" fill="#495057" font-size="13.475035091237215" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">B</text><text data-type="text" data-label="C" data-x="5.18" data-y="-2.0999999999999996" x="591.9149789452576" y="458.39983958291555" fill="#d9480f" font-size="13.475035091237215" font-family="sans-serif" text-anchor="start" dominant-baseline="central">C</text><text data-type="text" data-label="C" data-x="-1.85" data-y="-0.28" x="197.2087427311009" y="356.2141568077" fill="#495057" font-size="13.475035091237215" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">C</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":56.145979546821735,"c":0,"e":301.0788048927211,"b":0,"d":-56.145979546821735,"f":340.4932825345899};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>