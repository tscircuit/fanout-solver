<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 0.4,0" data-type="line" data-label="" points="56.31067961165047,409.02912621359224 99.80582524271844,409.02912621359224" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="0.4,0 0.6,0.2" data-type="line" data-label="" points="99.80582524271844,409.02912621359224 121.55339805825241,387.28155339805824" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="0.6,0.2 0.6499999999999999,0.24999999999999994" data-type="line" data-label="" points="121.55339805825241,387.28155339805824 126.9902912621359,381.84466019417476" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="0.6499999999999999,0.24999999999999994 0.6499999999999999,0.7312499999999997" data-type="line" data-label="" points="126.9902912621359,381.84466019417476 126.9902912621359,329.5145631067961" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="0.6499999999999999,0.7312499999999997 1.7062500000000003,1.7875" data-type="line" data-label="" points="126.9902912621359,329.5145631067961 241.84466019417476,214.6601941747573" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="1.7062500000000003,1.7875 4.387499999999999,1.7875" data-type="line" data-label="" points="241.84466019417476,214.6601941747573 533.3980582524271,214.6601941747573" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="4.387499999999999,1.7875 4.875,1.3000000000000003" data-type="line" data-label="" points="533.3980582524271,214.6601941747573 586.4077669902912,267.66990291262135" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="4.875,1.3000000000000003 4.8999999999999995,1.3000000000000003" data-type="line" data-label="" points="586.4077669902912,267.66990291262135 589.126213592233,267.66990291262135" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><polyline data-points="4.8999999999999995,1.3000000000000003 5,1.2" data-type="line" data-label="" points="589.126213592233,267.66990291262135 600,278.54368932038835" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="10.87378640776699"/></g><g><rect data-type="rect" data-label="inner1" data-x="2" data-y="0.8" x="252.03883495145627" y="235.04854368932035" width="43.49514563106794" height="173.98058252427185" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.009196428571428572"/></g><g><rect data-type="rect" data-label="top
