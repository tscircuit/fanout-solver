<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-0.4,-1.6 -0.4,1.2" data-type="line" data-label="" points="246.31578947368425,526.3157894736842 246.31578947368425,113.68421052631575" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="11.978105263157897"/></g><g><polyline data-points="-1.6,0.8 -1.2,0.4" data-type="line" data-label="" points="69.47368421052633,172.63157894736838 128.421052631579,231.578947368421" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="11.978105263157897"/></g><g><polyline data-points="-1.2,0.4 2,0.4" data-type="line" data-label="" points="128.421052631579,231.578947368421 600,231.578947368421" fill="none" stroke="#16a34a" stroke-linejoin="round" stroke-width="11.978105263157897"/></g><g><polyline data-points="-1.6,-0.8 -1.2,-1.2" data-type="line" data-label="" points="69.47368421052633,408.4210526315789 128.421052631579,467.36842105263156" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="11.978105263157897"/></g><g><polyline data-points="0,0 0.4,-0.4" data-type="line" data-label="" points="305.2631578947369,290.52631578947364 364.21052631578954,349.4736842105263" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="11.978105263157897"/></g><g><polyline data-points="0,-0.8 0.4,-1.2000000000000002" data-type="line" data-label="" points="305.2631578947369,408.4210526315789 364.21052631578954,467.36842105263156" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="11.978105263157897"/></g><circle data-type="circle" data-label="" data-x="-1.2" data-y="0.4" cx="128.421052631579" cy="231.578947368421" r="17.68421052631579" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-1.2" data-y="-1.2" cx="128.421052631579" cy="467.36842105263156" r="17.68421052631579" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0.4" data-y="-0.4" cx="364.21052631578954" cy="349.4736842105263" r="17.68421052631579" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0.4" data-y="-1.2000000000000002" cx="364.21052631578954" cy="467.36842105263156" r="17.68421052631579" fill="blue" stroke="none" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-1.6" data-y="0.8" cx="69.47368421052633" cy="172.63157894736838" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-1.6" data-y="-0.8" cx="69.47368421052633" cy="408.4210526315789" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="305.2631578947369" cy="290.52631578947364" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0" data-y="-0.8" cx="305.2631578947369" cy="408.4210526315789" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-0.8" data-y="-0.8" cx="187.36842105263162" cy="408.4210526315789" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-0.8" data-y="0" cx="187.36842105263162" cy="290.52631578947364" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="-0.8" data-y="0.8" cx="187.36842105263162" cy="172.63157894736838" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0" data-y="0.8" cx="305.2631578947369" cy="172.63157894736838" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0.8" data-y="-0.8" cx="423.15789473684214" cy="408.4210526315789" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0.8" data-y="0" cx="423.15789473684214" cy="290.52631578947364" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><circle data-type="circle" data-label="" data-x="0.8" data-y="0.8" cx="423.15789473684214" cy="172.63157894736838" r="29.47368421052632" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.0067857142857142855"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":147.3684210526316,"c":0,"e":305.2631578947369,"b":0,"d":-147.3684210526316,"f":290.52631578947364};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>