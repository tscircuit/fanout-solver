bottom" data-x="0" data-y="-5" cx="452.9430894308943" cy="600" r="3" fill="hsl(170, 100%, 50%)"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":91.05691056910568,"c":0,"e":452.9430894308943,"b":0,"d":-91.05691056910568,"f":144.71544715447158};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg><svg x="640" y="32" width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-3,1.05 -3.3,0.75" data-type="line" data-label="" points="197.07317073170736,49.1056910569106 169.75609756097566,76.42276422764232" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="-3.3,0.75 -3.32512,0.7248799999999997" data-type="line" data-label="" points="169.75609756097566,76.42276422764232 167.46874796747971,78.71011382113828" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="-3.32512,0.7248799999999997 -3.32512,-3.4748799999999997" data-type="line" data-label="" points="167.46874796747971,78.71011382113828 167.46874796747971,461.1272845528455" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="-3.32512,-3.4748799999999997 -3.3,-3.5" data-type="line" data-label="" points="167.46874796747971,461.1272845528455 169.75609756097566,463.4146341463415" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="-0.3,0.3 0,0" data-type="line" data-label="" points="442.9268292682927,117.39837398373987 470.2439024390244,144.71544715447158" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="0,0 0.007360000000000255,-0.007360000000000255" data-type="line" data-label="" points="470.2439024390244,144.71544715447158 470.91408130081305,145.3856260162602" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="0.007360000000000255,-0.007360000000000255 0.007360000000000255,-3.4926399999999997" data-type="line" data-label="" points="470.91408130081305,145.3856260162602 470.91408130081305,462.74445528