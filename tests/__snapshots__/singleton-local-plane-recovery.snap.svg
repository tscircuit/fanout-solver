<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="672" viewBox="0 0 1280 672"><rect width="1280" height="672" fill="white"/><text x="20" y="24" font-family="sans-serif" font-size="18">Before: enclosed source</text><text x="660" y="24" font-family="sans-serif" font-size="18">After: both routes reach the bottom edge</text><svg x="0" y="32" width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="-3,1.05 -3.3,0.75" data-type="line" data-label="" points="179.77235772357727,49.1056910569106 152.45528455284557,76.42276422764232" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="-3.3,0.75 0.41872,0.75" data-type="line" data-label="" points="152.45528455284557,76.42276422764232 491.0704390243902,76.42276422764232" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="0.41872,0.75 0.5,0.66872" data-type="line" data-label="" points="491.0704390243902,76.42276422764232 498.4715447154471,83.82386991869922" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="0.5,0.66872 0.5,-0.66872" data-type="line" data-label="" points="498.4715447154471,83.82386991869922 498.4715447154471,205.60702439024394" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="0.5,-0.66872 0.41872,-0.75" data-type="line" data-label="" points="498.4715447154471,205.60702439024394 491.0704390243902,213.00813008130083" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.401105691056911"/></g><g><polyline data-points="0.41872,-0.75 -3.21872,-0.75" data-type="line" data-label="" points="491.0704390243902,213.00813008130083 159.85639024390247,213.00813008130083" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.4011056