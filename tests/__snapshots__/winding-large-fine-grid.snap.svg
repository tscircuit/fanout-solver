<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 0.4,0.4" data-type="line" data-label="" points="45.803108808290176,323.38205181347155 61.27806563039726,307.9070949913645" fill="none" stroke="#ef4444" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><polyline data-points="0.4,0.4 0.4679600000000015,0.4679600000000015" data-type="line" data-label="" points="61.27806563039726,307.9070949913645 63.9072607944733,305.2778998272884" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><polyline data-points="0.4679600000000015,0.4679600000000015 0.5492400000000011,0.4679600000000015" data-type="line" data-label="" points="63.9072607944733,305.2778998272884 67.05177202072545,305.2778998272884" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><polyline data-points="0.5492400000000011,0.4679600000000015 2.256120000000003,2.174840000000003" data-type="line" data-label="" points="67.05177202072545,305.2778998272884 133.08650777202087,239.24316407599304" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><polyline data-points="2.256120000000003,2.174840000000003 12.497400000000003,2.174840000000003" data-type="line" data-label="" points="133.08650777202087,239.24316407599304 529.2949222797929,239.24316407599304" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><polyline data-points="12.497400000000003,2.174840000000003 14.204280000000004,0.4679600000000015" data-type="line" data-label="" points="529.2949222797929,239.24316407599304 595.3296580310882,305.2778998272884" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><polyline data-points="14.204280000000004,0.4679600000000015 14.257039999999998,0.4679600000000015" data-type="line" data-label="" points="595.3296580310882,305.2778998272884 597.3708048359239,305.2778998272884" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><polyline data-points="14.257039999999998,0.4679600000000015 14.325,0.4" data-type="line" data-label="" points="597.3708048359239,305.2778998272884 600,307.9070949913645" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.144511226252159"/></g><g><rect data-type="rect" data-label="top" data-x="0" data-y="0" x="40.00000000000002" y="317.5789430051814" width="11.60621761658031" height="11.606217616580352" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.025848214285714287"/></g><g><rect data-type="rect" data-label="inner1" data-x="6" data-y="0" x="258.58376511226254" y="246.00726770293613" width="38.68739205526765" height="154.74956822107083" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.025848214285714287"/></g><circle data-type="circle" data-label="" data-x="0.4" data-y="0.4" cx="61.27806563039726" cy="307.9070949913645" r="5.803108808290155" fill="blue" stroke="none" stroke-width="0.025848214285714287"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":38.6873920552677,"c":0,"e":45.803108808290176,"b":0,"d":-38.6873920552677,"f":323.38205181347155};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>