76.8888888888889,299.15555555555557" fill="none" stroke="#7c3aed" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="0.2,0.9 0.2,0.6" data-type="line" data-label="" points="176.8888888888889,299.15555555555557 176.8888888888889,317.82222222222225" fill="none" stroke="#7c3aed" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="0.2,0.6 2,0.6" data-type="line" data-label="" points="176.8888888888889,317.82222222222225 288.8888888888889,317.82222222222225" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="3.2,-0.6 3.5,-0.6" data-type="line" data-label="" points="363.55555555555554,392.4888888888889 382.22222222222223,392.4888888888889" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="3.5,-0.6 7,-0.6" data-type="line" data-label="" points="382.22222222222223,392.4888888888889 600,392.4888888888889" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="3.2,0.6 3.5,0.6" data-type="line" data-label="" points="363.55555555555554,317.82222222222225 382.22222222222223,317.82222222222225" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="3.5,0.6 3.8,0.9" data-type="line" data-label="" points="382.22222222222223,317.82222222222225 400.8888888888889,299.15555555555557" fill="none" stroke="#7c3aed" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="3.8,0.9 5.1875,0.9" data-type="line" data-label="" points="400.8888888888889,299.15555555555557 487.22222222222223,299.15555555555557" fill="none" stroke="#7c3aed" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="5.1875,0.9 5.2,0.8875000000000001" data-type="line" data-label="" points="487.22222222222223,299.15555555555557 488,299.93333333333334" fill="none" stroke="#7c3aed" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="5.2,0.8875000000000001 5.2,0.6" data-type="line" data-label="" points="488,299.93333333333334 488,317.82222222222225" fill="none" stroke="#7c3aed" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><polyline data-points="5.2,0.6 7,0.6" data-type="line" data-label="" points="488,317.82222222222225 600,317.82222222222225" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="3.111111111111111"/></g><g><rect data-type="rect" data-label="" data-x="-0.8" data-y="0.6" x="107.20000000000002" y="310.3555555555556" width="14.933333333333323" height="14.933333333333337" fill="#64748b" stroke="black" stroke-width="0.016071428571428573"/></g><g><rect data-type="rect" data-label="" data-x="4.2" data-y="0.6" x="418.31111111111113" y="310.3555555555556" width="14.933333333333337" height="14.933333333333337" fill="#64748b" stroke="black" stroke-width="0.016071428571428573"/></g><circle data-type="circle" data-label="" data-x="-1.5" data-y="-0.6" cx="71.11111111111113" cy="392.4888888888889" r="4.355555555555556" fill="#334155" stroke="black" stroke-width="0.016071428571428573"/><circle data-type="circle" data-label="" data-x="-1.5" data-y="0.6" cx="71.11111111111113" cy="317.82222222222225" r="4.355555555555556" fill="#334155" stroke="black" stroke-width="0.016071428571428573"/><circle data-type="circle" data-label="" data-x="0.2" data-y="0.6" cx="176.8888888888889" cy="317.82222222222225" r="4.355555555555556" fill="#334155" stroke="black" stroke-width="0.016071428571428573"/><circle data-type="circle" data-label="" data-x="3.5" data-y="-0.6" cx="382.22222222222223" cy="392.4888888888889" r="4.355555555555556" fill="#334155" stroke="black" stroke-width="0.016071428571428573"/><circle data-type="circle" data-label="" data-x="3.5" data-y="0.6" cx="382.22222222222223" cy="317.82222222222225" r="4.355555555555556" fill="#334155" stroke="black" stroke-width="0.016071428571428573"/><circle data-type="circle" data-label="" data-x="5.2" data-y="0.6" cx="488" cy="317.82222222222225" r="4.355555555555556" fill="#334155" stroke="black" stroke-width="0.016071428571428573"/><text data-type="text" data-label="Before: excess length around a pad" data-x="-2" data-y="1.8" x="40.000000000000014" y="243.15555555555557" fill="black" font-size="7.466666666666666" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">Before: excess length around a pad</text><text data-type="text" data-label="After: source and both vias stay fixed" data-x="3" data-y="1.8" x="351.1111111111111" y="243.15555555555557" fill="black" font-size="7.466666666666666" font-family="sans-serif" text-anchor="start" dominant-baseline="text-after-edge">After: source and both vias stay fixed</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":62.22222222222222,"c":0,"e":164.44444444444446,"b":0,"d":-62.22222222222222,"f":355.15555555555557};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>