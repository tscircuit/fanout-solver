width="0.006921052631578947"/><circle data-type="circle" data-label="" data-x="3.33" data-y="-1.2000000000000002" cx="732.045627376426" cy="470.5703422053232" r="17.338403041825096" fill="#d97706" stroke="black" stroke-width="0.006921052631578947"/><circle data-type="circle" data-label="" data-x="3.33" data-y="-1.2000000000000002" cx="732.045627376426" cy="470.5703422053232" r="10.836501901140686" fill="white" stroke="black" stroke-width="0.006921052631578947"/><circle data-type="circle" data-label="" data-x="3" data-y="0.4" cx="684.3650190114068" cy="239.39163498098856" r="17.338403041825096" fill="#d97706" stroke="black" stroke-width="0.006921052631578947"/><circle data-type="circle" data-label="" data-x="3" data-y="0.4" cx="684.3650190114068" cy="239.39163498098856" r="10.836501901140686" fill="white" stroke="black" stroke-width="0.006921052631578947"/><circle data-type="circle" data-label="" data-x="3.66" data-y="-0.4" cx="779.726235741445" cy="354.98098859315587" r="17.338403041825096" fill="#d97706" stroke="black" stroke-width="0.006921052631578947"/><circle data-type="circle" data-label="" data-x="3.66" data-y="-0.4" cx="779.726235741445" cy="354.98098859315587" r="10.836501901140686" fill="white" stroke="black" stroke-width="0.006921052631578947"/><text data-type="text" data-label="Control: rule omitted" data-x="0.2" data-y="1.7" x="279.80228136882124" y="51.55893536121667" fill="black" font-size="23.117870722433462" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Control: rule omitted</text><text data-type="text" data-label="Actual minimum: 0.09 mm" data-x="0.2" data-y="1.4" x="279.80228136882124" y="94.90494296577941" fill="black" font-size="20.22813688212928" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Actual minimum: 0.09 mm</text><text data-type="text" data-label="Board via gap: 0.10 mm" data-x="3.2" data-y="1.7" x="713.2623574144487" y="51.55893536121667" fill="black" font-size="23.117870722433462" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Board via gap: 0.10 mm</text><text data-type="text" data-label="Actual minimum: 0.42 mm" data-x="3.2" data-y="1.4" x="713.2623574144487" y="94.90494296577941" fill="black" font-size="20.22813688212928" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Actual minimum: 0.42 mm</text><text data-type="text" data-label="Same 0.08128 mm via-to-pad rule; 0.24 mm copper / 0.15 mm holes" data-x="1.7" data-y="-1.8" x="496.532319391635" y="557.2623574144486" fill="black" font-size="18.78326996197719" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Same 0.08128 mm via-to-pad rule; 0.24 mm copper / 0.15 mm holes</text><text data-type="text" data-label="Gray: component pads | Orange: via copper | Blue: traces" data-x="1.7" data-y="-2.1" x="496.532319391635" y="600.6083650190114" fill="black" font-size="18.78326996197719" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Gray: component pads | Orange: via copper | Blue: traces</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="650" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1000" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1000');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '650');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":144.48669201520914,"c":0,"e":250.90494296577944,"b":0,"d":-144.48669201520914,"f":297.1863117870722};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>