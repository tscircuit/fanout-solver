<svg width="640" height="640" viewBox="0 0 640 640" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><g><polyline data-points="0,0 -0.4,-0.4" data-type="line" data-label="" points="95,335.9375 70,360.9375" fill="none" stroke="#2b8a3e" stroke-linejoin="round" stroke-width="6.25"/></g><g><polyline data-points="3.4,0 3,-0.4" data-type="line" data-label="" points="307.5,335.9375 282.5,360.9375" fill="none" stroke="#868e96" stroke-linejoin="round" stroke-width="6.25"/></g><g><polyline data-points="6.8,0 6.3999999999999995,-0.4" data-type="line" data-label="" points="520,335.9375 494.99999999999994,360.9375" fill="none" stroke="#868e96" stroke-linejoin="round" stroke-width="6.25"/></g><g><rect data-type="rect" data-label="" data-x="-0.1" data-y="-0.1" x="87.1875" y="340.625" width="3.125" height="3.125" fill="#1971c2" stroke="#1971c2" stroke-width="0.016"/></g><g><rect data-type="rect" data-label="" data-x="3.3" data-y="-0.1" x="299.6875" y="340.625" width="3.125" height="3.125" fill="#e03131" stroke="#e03131" stroke-width="0.016"/></g><g><rect data-type="rect" data-label="" data-x="6.3999999999999995" data-y="-0.4" x="493.4374999999999" y="359.375" width="3.125000000000057" height="3.125" fill="#1971c2" stroke="#1971c2" stroke-width="0.016"/></g><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="95" cy="335.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="0" data-y="0.8" cx="95" cy="285.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="0.8" data-y="0" cx="145" cy="335.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="0.8" data-y="0.8" cx="145" cy="285.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="-0.4" cx="70" cy="360.9375" r="15.624999999999998" fill="rgba(43,138,62,0.2)" stroke="#2b8a3e" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="-0.4" data-y="-0.4" cx="70" cy="360.9375" r="9.374999999999998" fill="none" stroke="#2b8a3e" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="3.4" data-y="0" cx="307.5" cy="335.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="3.4" data-y="0.8" cx="307.5" cy="285.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="4.2" data-y="0" cx="357.5" cy="335.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="4.2" data-y="0.8" cx="357.5" cy="285.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="3" data-y="-0.4" cx="282.5" cy="360.9375" r="15.624999999999998" fill="rgba(134,142,150,0.2)" stroke="#868e96" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="3" data-y="-0.4" cx="282.5" cy="360.9375" r="9.374999999999998" fill="none" stroke="#868e96" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="6.8" data-y="0" cx="520" cy="335.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="6.8" data-y="0.8" cx="520" cy="285.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="7.6" data-y="0" cx="570" cy="335.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="7.6" data-y="0.8" cx="570" cy="285.9375" r="12.5" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="6.3999999999999995" data-y="-0.4" cx="494.99999999999994" cy="360.9375" r="15.624999999999998" fill="rgba(134,142,150,0.2)" stroke="#868e96" stroke-width="0.016"/><circle data-type="circle" data-label="" data-x="6.3999999999999995" data-y="-0.4" cx="494.99999999999994" cy="360.9375" r="9.374999999999998" fill="none" stroke="#868e96" stroke-width="0.016"/><text data-type="text" data-label="BOTTOM pad under TOP wire" data-x="0.2" data-y="1.55" x="107.5" y="239.0625" fill="black" font-size="8.75" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BOTTOM pad under TOP wire</text><text data-type="text" data-label="Accepted: different wire layer" data-x="0.2" data-y="-1.05" x="107.5" y="401.5625" fill="#2b8a3e" font-size="7.499999999999999" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Accepted: different wire layer</text><text data-type="text" data-label="TOP pad across TOP wire" data-x="3.6" data-y="1.55" x="320" y="239.0625" fill="black" font-size="8.75" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TOP pad across TOP wire</text><text data-type="text" data-label="Rejected: same-layer wire collision" data-x="3.6" data-y="-1.05" x="320" y="401.5625" fill="#c92a2a" font-size="7.499999999999999" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Rejected: same-layer wire collision</text><text data-type="text" data-label="BOTTOM pad at through-via" data-x="7" data-y="1.55" x="532.5" y="239.0625" fill="black" font-size="8.75" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BOTTOM pad at through-via</text><text data-type="text" data-label="Rejected: via spans BOTTOM too" data-x="7" data-y="-1.05" x="532.5" y="401.5625" fill="#c92a2a" font-size="7.499999999999999" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Rejected: via spans BOTTOM too</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":62.49999999999999,"c":0,"e":95,"b":0,"d":-62.49999999999999,"f":335.9375};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>