231759656652" cy="618.8412017167382" r="24.034334763948497" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.008321428571428572"/><circle data-type="circle" data-label="" data-x="7.6" data-y="-3.9" cx="1076.3605150214592" cy="714.9785407725321" r="24.034334763948497" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.008321428571428572"/><circle data-type="circle" data-label="" data-x="7.6" data-y="-3.0999999999999996" cx="1076.3605150214592" cy="618.8412017167382" r="24.034334763948497" fill="rgba(233,236,239,0.5)" stroke="#adb5bd" stroke-width="0.008321428571428572"/><circle data-type="circle" data-label="" data-x="6.3999999999999995" data-y="-4.3" cx="932.1545064377681" cy="763.0472103004291" r="30.04291845493562" fill="rgba(134,142,150,0.2)" stroke="#868e96" stroke-width="0.008321428571428572"/><circle data-type="circle" data-label="" data-x="6.3999999999999995" data-y="-4.3" cx="932.1545064377681" cy="763.0472103004291" r="18.02575107296137" fill="none" stroke="#868e96" stroke-width="0.008321428571428572"/><text data-type="text" data-label="BOTTOM pad under TOP wire" data-x="0.2" data-y="1.55" x="187.09012875536484" y="60.04291845493569" fill="black" font-size="16.824034334763947" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BOTTOM pad under TOP wire</text><text data-type="text" data-label="Accepted: different wire layer" data-x="0.2" data-y="-1.05" x="187.09012875536484" y="372.4892703862661" fill="#2b8a3e" font-size="14.420600858369097" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Accepted: different wire layer</text><text data-type="text" data-label="TOP pad across TOP wire" data-x="3.6" data-y="1.55" x="595.6738197424893" y="60.04291845493569" fill="black" font-size="16.824034334763947" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TOP pad across TOP wire</text><text data-type="text" data-label="Rejected: same-layer wire collision" data-x="3.6" data-y="-1.05" x="595.6738197424893" y="372.4892703862661" fill="#c92a2a" font-size="14.420600858369097" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Rejected: same-layer wire collision</text><text data-type="text" data-label="BOTTOM pad at through-via" data-x="7" data-y="1.55" x="1004.2575107296136" y="60.04291845493569" fill="black" font-size="16.824034334763947" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">BOTTOM pad at through-via</text><text data-type="text" data-label="Rejected: via spans BOTTOM too" data-x="7" data-y="-1.05" x="1004.2575107296136" y="372.4892703862661" fill="#c92a2a" font-size="14.420600858369097" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Rejected: via spans BOTTOM too</text><text data-type="text" data-label="INNER1 pour at through-via" data-x="0.2" data-y="-2.3499999999999996" x="187.09012875536484" y="528.7124463519314" fill="black" font-size="16.824034334763947" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">INNER1 pour at through-via</text><text data-type="text" data-label="Accepted: pour can form an antipad" data-x="0.2" data-y="-4.95" x="187.09012875536484" y="841.1587982832618" fill="#2b8a3e" font-size="14.420600858369097" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Accepted: pour can form an antipad</text><text data-type="text" data-label="TOP pour across TOP wire" data-x="3.6" data-y="-2.3499999999999996" x="595.6738197424893" y="528.7124463519314" fill="black" font-size="16.824034334763947" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TOP pour across TOP wire</text><text data-type="text" data-label="Rejected: source-layer wire collision" data-x="3.6" data-y="-4.95" x="595.6738197424893" y="841.1587982832618" fill="#c92a2a" font-size="14.420600858369097" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Rejected: source-layer wire collision</text><text data-type="text" data-label="TOP pour at through-via" data-x="7" data-y="-2.3499999999999996" x="1004.2575107296136" y="528.7124463519314" fill="black" font-size="16.824034334763947" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">TOP pour at through-via</text><text data-type="text" data-label="Rejected: source-layer via collision" data-x="7" data-y="-4.95" x="1004.2575107296136" y="841.1587982832618" fill="#c92a2a" font-size="14.420600858369097" font-family="sans-serif" text-anchor="middle" dominant-baseline="central">Rejected: source-layer via collision</text><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="900" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="1200" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '1200');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '900');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":120.17167381974248,"c":0,"e":163.05579399141635,"b":0,"d":-120.17167381974248,"f":246.30901287553652};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>