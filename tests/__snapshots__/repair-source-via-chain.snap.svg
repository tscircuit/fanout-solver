e="black" stroke-width="0.008482142857142856"/><circle data-type="circle" data-label="" data-x="0.65" data-y="-0.325" cx="393.6842105263158" cy="358.3157894736842" r="17.684210526315788" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.008482142857142856"/><circle data-type="circle" data-label="" data-x="0.65" data-y="0.325" cx="393.6842105263158" cy="281.6842105263158" r="17.684210526315788" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.008482142857142856"/><circle data-type="circle" data-label="" data-x="0.65" data-y="0.975" cx="393.6842105263158" cy="205.05263157894737" r="17.684210526315788" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.008482142857142856"/><circle data-type="circle" data-label="" data-x="1.3" data-y="-0.975" cx="470.31578947368416" cy="434.9473684210526" r="17.684210526315788" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.008482142857142856"/><circle data-type="circle" data-label="" data-x="1.3" data-y="-0.325" cx="470.31578947368416" cy="358.3157894736842" r="17.684210526315788" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.008482142857142856"/><circle data-type="circle" data-label="" data-x="1.3" data-y="0.325" cx="470.31578947368416" cy="281.6842105263158" r="17.684210526315788" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.008482142857142856"/><circle data-type="circle" data-label="" data-x="1.3" data-y="0.975" cx="470.31578947368416" cy="205.05263157894737" r="17.684210526315788" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.008482142857142856"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');

                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":117.89473684210526,"c":0,"e":317.05263157894734,"b":0,"d":-117.89473684210526,"f":320};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e;
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }

                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>
