nts="51.351351351351354,337.02702702702703 51.351351351351354,284.05405405405406" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.567567567567568"/></g><g><polyline data-points="-1.2500000000000002,1 -1.2500000000000002,2.1" data-type="line" data-label="" points="51.351351351351354,284.05405405405406 51.351351351351354,200.8108108108108" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.567567567567568"/></g><g><polyline data-points="-1.2500000000000002,2.1 -1.1500000000000001,2.2" data-type="line" data-label="" points="51.351351351351354,200.8108108108108 58.91891891891892,193.24324324324323" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.567567567567568"/></g><g><polyline data-points="-1.1500000000000001,2.2 5.000000000000001,2.2" data-type="line" data-label="" points="58.91891891891892,193.24324324324323 524.3243243243244,193.24324324324323" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.567567567567568"/></g><g><polyline data-points="5.000000000000001,2.2 6,2.2" data-type="line" data-label="" points="524.3243243243244,193.24324324324323 600,193.24324324324323" fill="none" stroke="#2563eb" stroke-linejoin="round" stroke-width="7.567567567567568"/></g><circle data-type="circle" data-label="" data-x="5.5" data-y="-1" cx="562.1621621621622" cy="435.4054054054054" r="11.35135135135135" fill="blue" stroke="none" stroke-width="0.013214285714285715"/><circle data-type="circle" data-label="" data-x="0" data-y="0" cx="145.94594594594597" cy="359.72972972972974" r="11.35135135135135" fill="blue" stroke="none" stroke-width="0.013214285714285715"/><circle data-type="circle" data-label="" data-x="-1" data-y="0" cx="70.27027027027029" cy="359.72972972972974" r="11.35135135135135" fill="blue" stroke="none" stroke-width="0.013214285714285715"/><circle data-type="circle" data-label="" data-x="0.3" data-y="-0.3" cx="168.64864864864867" cy="382.43243243243245" r="7.567567567567568" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.013214285714285715"/><circle data-type="circle" data-label="" data-x="-1.3" data-y="-0.3" cx="47.56756756756758" cy="382.43243243243245" r="7.567567567567568" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.013214285714285715"/><circle data-type="circle" data-label="" data-x="0" data-y="-1" cx="145.94594594594597" cy="435.4054054054054" r="7.567567567567568" fill="rgba(255,0,0,0.5)" stroke="black" stroke-width="0.013214285714285715"/><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="640" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="640" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '640');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '640');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":75.67567567567568,"c":0,"e":145.94594594594597,"b":0,"d":-75.67567567567568,"f":359.72972972972974};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>